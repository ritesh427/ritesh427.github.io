  <title>DevPath · Developer Learning Dashboard</title>

  <style>
/* =========================================================
   DevPath styles
   Tokens are hue-driven: change --hue (Settings > Accent) and the whole UI follows.
   ========================================================= */
:root {
  --hue: 239;
  --bg: #0b0d17;
  --bg-2: #0f1220;
  --surface: rgba(255, 255, 255, .04);
  --surface-2: rgba(255, 255, 255, .07);
  --surface-solid: #141829;
  --border: rgba(255, 255, 255, .09);
  --border-2: rgba(255, 255, 255, .16);
  --text: #eef1f8;
  --muted: #8e98b0;
  --primary: hsl(var(--hue) 88% 70%);
  --primary-text: hsl(var(--hue) 90% 76%);
  --primary-btn: hsl(var(--hue) 82% 60%);
  --primary-btn-2: hsl(calc(var(--hue) + 28) 82% 62%);
  --primary-soft: hsl(var(--hue) 88% 70% / .14);
  --on-primary: #fff;
  --success: #34d399;
  --warning: #fbbf24;
  --danger: #f87171;
  --shadow: 0 10px 30px -12px rgba(0, 0, 0, .55);
  --shadow-lg: 0 30px 80px -20px rgba(0, 0, 0, .7);
  --glow: radial-gradient(900px 420px at 85% -10%, hsl(var(--hue) 90% 60% / .16), transparent 60%), radial-gradient(700px 380px at -5% 10%, hsl(calc(var(--hue) + 60) 90% 60% / .09), transparent 60%);
  --radius: 16px;
  --side-w: 272px;
  --ease: cubic-bezier(.22, .8, .24, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f6fb;
  --bg-2: #eef1f8;
  --surface: #ffffff;
  --surface-2: #f0f3fa;
  --surface-solid: #ffffff;
  --border: rgba(15, 23, 42, .1);
  --border-2: rgba(15, 23, 42, .2);
  --text: #0f172a;
  --muted: #5a6479;
  --primary: hsl(var(--hue) 78% 50%);
  --primary-text: hsl(var(--hue) 78% 32%);
  --primary-btn: hsl(var(--hue) 80% 52%);
  --primary-btn-2: hsl(calc(var(--hue) + 28) 80% 54%);
  --primary-soft: hsl(var(--hue) 80% 52% / .11);
  --success: #059669;
  --warning: #b45309;
  --danger: #dc2626;
  --shadow: 0 8px 24px -14px rgba(30, 41, 80, .35);
  --shadow-lg: 0 30px 80px -24px rgba(30, 41, 80, .45);
  --glow: radial-gradient(900px 420px at 85% -10%, hsl(var(--hue) 90% 60% / .12), transparent 60%), radial-gradient(700px 380px at -5% 10%, hsl(calc(var(--hue) + 60) 90% 60% / .07), transparent 60%);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg) var(--glow) no-repeat fixed; color: var(--text);
  font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: clamp(1.55rem, 1.1rem + 1.6vw, 2.15rem); line-height: 1.15; letter-spacing: -.02em; font-weight: 750; }
h2 { font-size: 1.15rem; letter-spacing: -.01em; font-weight: 700; }
h3 { font-size: .98rem; font-weight: 650; }
h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 0 10px; font-weight: 650; }
a { color: inherit; text-decoration: none; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .45; }
ul, ol { margin: 0; padding: 0; list-style: none; }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: .85em; }
mark { background: hsl(var(--hue) 95% 60% / .3); color: inherit; border-radius: 4px; padding: 0 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.spacer { flex: 1; }
.ico { flex: none; vertical-align: middle; }
.ico-fill { fill: currentColor; }
.flip { transform: rotate(180deg); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
kbd { font: 600 .72rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px; padding: 3px 6px; border-radius: 6px; color: var(--muted); }
::selection { background: hsl(var(--hue) 90% 60% / .35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 999; background: var(--primary-btn); color: var(--on-primary); padding: 10px 14px; border-radius: 10px; font-weight: 650; transition: top .2s; }
.skip:focus { top: 12px; }

/* ---------- layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; width: var(--side-w); flex: none; display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--bg-2) 82%, transparent); backdrop-filter: blur(18px); border-right: 1px solid var(--border);
  padding: 18px 12px 12px; z-index: 60; transition: margin-left .35s var(--ease), transform .35s var(--ease);
}
body.side-collapsed .sidebar { margin-left: calc(var(--side-w) * -1); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 14px; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--on-primary); background: linear-gradient(135deg, var(--primary-btn), var(--primary-btn-2)); box-shadow: 0 6px 18px -6px hsl(var(--hue) 90% 60% / .7); }
.brand-name { font-size: 1.28rem; font-weight: 800; letter-spacing: -.03em; background: linear-gradient(135deg, var(--text), var(--primary-text)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.side-progress { margin: 0 6px 12px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.sp-row { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
.sp-row b { color: var(--text); }
.side-progress small { display: block; margin-top: 8px; color: var(--muted); font-size: .76rem; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar.thin { height: 5px; margin: 7px 0 3px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary-btn), var(--primary-btn-2)); transition: width .6s var(--ease); }
.nav { flex: 1; overflow-y: auto; padding: 2px 4px 8px; margin: 0 -4px; }
.nav-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding: 16px 12px 6px; font-weight: 650; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; margin: 1px 0; border-radius: 11px; color: var(--muted); font-weight: 560; font-size: .92rem; transition: background .2s, color .2s; position: relative; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--primary-soft); color: var(--primary-text); }
.nav-item.active::before { content: ""; position: absolute; left: -4px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--primary); }
.nav-item.cat.active { background: color-mix(in srgb, var(--cat) 15%, transparent); color: var(--text); }
.nav-item.cat.active::before { background: var(--cat); }
.nav-item span:not(.nav-badge):not(.nav-count) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-dot { font-style: normal; width: 22px; text-align: center; font-size: 1.02rem; filter: saturate(.9); }
.nav-badge, .nav-count { font-size: .72rem; font-weight: 650; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.nav-badge.ok { background: rgba(52, 211, 153, .16); color: var(--success); }
.nav-badge.warn { background: rgba(251, 191, 36, .18); color: var(--warning); }
.nav-count.full { background: rgba(52, 211, 153, .16); color: var(--success); }
.side-foot { display: flex; gap: 6px; padding: 10px 4px 0; border-top: 1px solid var(--border); }
.side-foot .btn { flex: 1; justify-content: center; }

.main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px clamp(16px, 3vw, 36px); background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
.search { position: relative; flex: 1; max-width: 540px; }
.search .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 42px; padding: 0 56px 0 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); outline: none; transition: border-color .2s, box-shadow .2s; }
.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#topStats { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: .88rem; color: var(--muted); transition: all .2s; }
.chip:hover { border-color: var(--border-2); color: var(--text); }
.chip b { color: var(--text); }
.chip.streak.lit { color: #fb923c; border-color: rgba(251, 146, 60, .4); background: rgba(251, 146, 60, .1); }
.chip.streak.lit b { color: #fb923c; }
.chip.due { color: var(--warning); border-color: rgba(251, 191, 36, .35); background: rgba(251, 191, 36, .08); }
.chip.due b { color: var(--warning); }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 11px; color: var(--muted); transition: all .2s; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.big { width: 44px; height: 44px; background: var(--primary-btn); color: var(--on-primary); border-radius: 50%; }
.icon-btn.big:hover { background: var(--primary-btn); filter: brightness(1.1); color: var(--on-primary); }
.only-mobile { display: none; }

main { padding: clamp(18px, 3vw, 36px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; align-content: start; max-width: 1480px; width: 100%; margin: 0 auto; outline: none; }
main.enter > * { animation: rise .55s var(--ease) both; }
main.enter > *:nth-child(2) { animation-delay: .05s; } main.enter > *:nth-child(3) { animation-delay: .1s; }
main.enter > *:nth-child(4) { animation-delay: .15s; } main.enter > *:nth-child(5) { animation-delay: .2s; }
main.enter > *:nth-child(n+6) { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- primitives ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .12em; color: var(--primary-text); font-weight: 700; margin-bottom: 6px; }
.sub { color: var(--muted); margin-top: 6px; max-width: 70ch; }
.sub b { color: var(--text); }
.page-actions, .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.wave { display: inline-block; animation: wave 2.4s ease-in-out 1s 2; transform-origin: 70% 70%; }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }

.btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: .88rem; white-space: nowrap; transition: transform .15s, background .2s, border-color .2s, box-shadow .2s; }
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-2); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.sm { height: 32px; padding: 0 11px; font-size: .8rem; border-radius: 9px; }
.btn.lg { height: 46px; padding: 0 22px; font-size: .95rem; border-radius: 13px; }
.btn.primary { background: linear-gradient(135deg, var(--primary-btn), var(--primary-btn-2)); color: var(--on-primary); border-color: transparent; box-shadow: 0 8px 22px -10px hsl(var(--hue) 90% 55% / .8); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: linear-gradient(135deg, var(--primary-btn), var(--primary-btn-2)); box-shadow: 0 10px 26px -10px hsl(var(--hue) 90% 55% / .95); }
.btn.primary kbd { background: rgba(255, 255, 255, .2); color: inherit; border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--text); }
.btn.success { background: rgba(52, 211, 153, .15); color: var(--success); border-color: rgba(52, 211, 153, .4); }
.btn.fav-on { color: #fbbf24; border-color: rgba(251, 191, 36, .45); background: rgba(251, 191, 36, .1); }
.btn.fav-on .ico { fill: currentColor; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.danger-o { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.btn.danger-o:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn.push { margin-left: auto; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card-label { display: flex; align-items: center; gap: 7px; font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 650; margin-bottom: 12px; }
.dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
.card-head, .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.section-head h2 small { font-weight: 500; font-size: .85rem; margin-left: 6px; }
.more { display: inline-flex; align-items: center; gap: 5px; font-size: .86rem; font-weight: 600; color: var(--primary-text); }
.more:hover { text-decoration: underline; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 650; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.sm { font-size: .66rem; padding: 2px 7px; }
.pill.warn { background: rgba(251, 191, 36, .16); color: var(--warning); }
.pill.ok { background: rgba(52, 211, 153, .15); color: var(--success); }
.pill.acc { background: var(--primary-soft); color: var(--primary-text); }
.num { display: inline-block; font-variant-numeric: tabular-nums; font-size: .74em; font-weight: 700; color: var(--primary-text); background: var(--primary-soft); padding: 1px 8px; border-radius: 7px; margin-right: 8px; vertical-align: 2px; }

/* ---------- dashboard ---------- */
.row-hero { display: grid; gap: 16px; grid-template-columns: minmax(0, 2.1fr) repeat(3, minmax(160px, 1fr)); }
.upnext { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 4px; background: linear-gradient(135deg, color-mix(in srgb, var(--cat, var(--primary)) 20%, var(--surface-solid)), var(--surface)); border-color: color-mix(in srgb, var(--cat, var(--primary)) 38%, var(--border)); }
.upnext::after { content: ""; position: absolute; right: -50px; top: -50px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--cat, var(--primary)) 38%, transparent), transparent 70%); pointer-events: none; }
.upnext h2 { font-size: 1.4rem; line-height: 1.25; letter-spacing: -.02em; margin: 2px 0; position: relative; }
.upnext .row-actions { margin-top: 14px; position: relative; z-index: 1; }
.ring-card { display: flex; flex-direction: column; align-items: center; text-align: center; }
.ring-card .card-label { align-self: flex-start; }
.ring-card p { margin-top: 10px; }
.ring { position: relative; flex: none; }
.ring-bg { fill: none; stroke: var(--surface-2); }
.ring-fg { fill: none; transition: stroke-dashoffset 1s linear; animation: ringIn 1.1s var(--ease) both; }
@keyframes ringIn { from { stroke-dashoffset: var(--circ); } }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring-label b { font-size: 1.65rem; font-weight: 780; letter-spacing: -.03em; }
.ring-label small { color: var(--muted); font-size: .72rem; margin-top: 3px; }
.slash { font-size: .55em; color: var(--muted); font-weight: 600; margin-left: 2px; }
.streak-card .big { font-size: 3rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; display: flex; align-items: baseline; gap: 8px; color: #fb923c; }
.streak-card .big small { font-size: .9rem; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.week-strip { display: flex; gap: 6px; margin: 16px 0 10px; }
.week-strip span { flex: 1; display: grid; justify-items: center; gap: 5px; font-size: .68rem; color: var(--muted); font-weight: 600; }
.week-strip i { width: 100%; max-width: 26px; aspect-ratio: 1; border-radius: 8px; background: var(--surface-2); transition: background .3s; }
.week-strip .on i { background: linear-gradient(135deg, #fb923c, #f43f5e); box-shadow: 0 4px 12px -4px rgba(244, 63, 94, .6); }
.week-strip .today i { outline: 2px solid var(--primary); outline-offset: 2px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat-card { position: relative; text-align: left; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); display: block; transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; box-shadow: var(--shadow); width: 100%; }
button.stat-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); box-shadow: 0 16px 34px -16px hsl(var(--hue) 90% 50% / .45); }
.stat-card.static { cursor: default; }
.stat-ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-text); margin-bottom: 14px; }
.stat-ico.ok { background: rgba(52, 211, 153, .14); color: var(--success); }
.stat-ico.warn { background: rgba(251, 191, 36, .15); color: var(--warning); }
.stat-ico.acc { background: rgba(168, 85, 247, .15); color: #c084fc; }
.stat-card h3 { font-size: .8rem; color: var(--muted); font-weight: 600; }
.stat-card .value { font-size: 2rem; font-weight: 780; letter-spacing: -.03em; line-height: 1.15; margin: 3px 0; font-variant-numeric: tabular-nums; }
.stat-card small { color: var(--muted); font-size: .76rem; display: block; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-2 > *, .row-hero > *, .stats-grid > * { min-width: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .75rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lgd { width: 10px; height: 10px; border-radius: 3px; background: var(--surface-2); display: inline-block; border: 1px solid var(--border); }
.lgd.ready { background: var(--success); border-color: transparent; } .lgd.done { background: var(--primary); border-color: transparent; } .lgd.rev { background: #f59e0b; border-color: transparent; }
.mastery { display: grid; gap: 4px; }
.mrow { display: grid; grid-template-columns: minmax(130px, 190px) 1fr 52px; align-items: center; gap: 12px; padding: 7px 8px; margin: 0 -8px; border-radius: 10px; transition: background .2s; }
a.mrow:hover { background: var(--surface-2); }
.mrow-name { display: flex; align-items: center; gap: 9px; font-size: .88rem; font-weight: 560; min-width: 0; }
.mrow-name i { font-style: normal; width: 20px; text-align: center; }
.mbar { height: 9px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
.mbar .seg { height: 100%; transition: width .7s var(--ease); }
.mbar .seg.ready { background: var(--success); } .mbar .seg.done { background: var(--cat, var(--primary)); }
.mrow-val { text-align: right; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.mini-list { display: grid; gap: 4px; margin-bottom: 8px; }
.mini-item { width: 100%; display: grid; grid-template-columns: 10px 1fr auto auto; gap: 10px; align-items: center; text-align: left; padding: 10px; border-radius: 11px; transition: background .2s; }
.mini-item:hover { background: var(--surface-2); }
.dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); }
.mi-title { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.mi-sub { color: var(--muted); font-size: .76rem; }

.dist { display: flex; gap: 10px; align-items: flex-end; height: 190px; }
.dist-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
.dist-n { font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; }
.dist-bar { flex: 1; width: 100%; max-width: 54px; display: flex; align-items: flex-end; background: var(--surface-2); border-radius: 10px; overflow: hidden; }
.dist-bar i { width: 100%; min-height: 3px; border-radius: 10px 10px 0 0; transition: height .8s var(--ease); }
.c1 { background: #64748b; } .c2 { background: #38bdf8; } .c3 { background: #a78bfa; } .c4 { background: #34d399; } .c5 { background: #fbbf24; }
.dist-e { font-size: 1.1rem; } .dist-col small { color: var(--muted); font-size: .7rem; }

.heat-wrap { overflow-x: auto; padding-bottom: 4px; }
.heat-months { display: grid; grid-template-columns: repeat(var(--weeks), minmax(13px, 1fr)); gap: 4px; font-size: .68rem; color: var(--muted); height: 16px; min-width: calc(var(--weeks) * 17px); }
.heat-months span { white-space: nowrap; overflow: visible; }
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: minmax(13px, 1fr); gap: 4px; min-width: calc(var(--weeks) * 17px); }
.hc { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); display: block; transition: transform .15s; }
.heat .hc:hover { transform: scale(1.35); outline: 1px solid var(--border-2); }
.hc.lv1 { background: hsl(var(--hue) 80% 55% / .3); } .hc.lv2 { background: hsl(var(--hue) 80% 58% / .55); }
.hc.lv3 { background: hsl(var(--hue) 85% 60% / .8); } .hc.lv4 { background: hsl(var(--hue) 95% 68%); }
.hc.fut { opacity: .25; }
.heat-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; gap: 8px; }
.heat-legend { display: inline-flex; align-items: center; gap: 4px; } .heat-legend .hc { width: 12px; height: 12px; }

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.ach { display: flex; gap: 14px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); opacity: .62; transition: all .25s; }
.ach.on { opacity: 1; border-color: color-mix(in srgb, #fbbf24 50%, var(--border)); background: linear-gradient(135deg, rgba(251, 191, 36, .1), var(--surface)); }
.ach-ico { font-size: 1.7rem; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); flex: none; filter: grayscale(1); }
.ach.on .ach-ico { filter: none; background: rgba(251, 191, 36, .16); }
.ach b { display: block; font-size: .92rem; } .ach small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.35; }
.ach em { font-style: normal; font-size: .72rem; color: var(--muted); }
.ach.on em { color: var(--warning); }
.ach > div { min-width: 0; flex: 1; }

/* ---------- topic cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.tcard { position: relative; display: flex; flex-direction: column; gap: 11px; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; overflow: hidden; }
.tcard::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--cat); opacity: .8; }
.tcard:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--cat) 50%, var(--border)); box-shadow: 0 18px 36px -18px color-mix(in srgb, var(--cat) 60%, transparent); }
.tcard.is-done { background: linear-gradient(180deg, rgba(52, 211, 153, .07), var(--surface) 60%); }
.tcard.is-done .tcard-title { color: var(--muted); }
.tcard-top { display: flex; align-items: center; gap: 9px; }
.check { width: 24px; height: 24px; flex: none; border-radius: 8px; border: 2px solid var(--border-2); display: grid; place-items: center; color: transparent; transition: all .2s var(--ease); }
.check.sm { width: 20px; height: 20px; border-radius: 6px; }
.check:hover { border-color: var(--success); }
.check.on { background: var(--success); border-color: var(--success); color: #fff; transform: scale(1.06); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 650; padding: 3px 10px 3px 6px; border-radius: 99px; color: var(--text); background: color-mix(in srgb, var(--cat, var(--primary)) 16%, transparent); border: 1px solid color-mix(in srgb, var(--cat, var(--primary)) 30%, transparent); }
.tag i { font-style: normal; } .tag.sm { font-size: .7rem; padding: 2px 9px 2px 5px; }
.star { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; color: var(--muted); transition: all .2s; flex: none; }
.star:hover { color: #fbbf24; background: var(--surface-2); }
.star.on { color: #fbbf24; } .star.on .ico { fill: currentColor; }
.tcard-title { font-size: 1rem; line-height: 1.35; font-weight: 650; cursor: pointer; letter-spacing: -.005em; flex: 1; }
.tcard-title:hover { color: var(--primary-text); }
.tcard-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.meta-i { display: inline-flex; align-items: center; gap: 4px; } .has-notes { color: var(--primary-text); }
.diff { font-size: .7rem; font-weight: 650; padding: 2px 8px; border-radius: 6px; }
.diff.intermediate { background: rgba(56, 189, 248, .14); color: #38bdf8; } .diff.advanced { background: rgba(244, 114, 182, .14); color: #f472b6; }
:root[data-theme="light"] .diff.intermediate { color: #0369a1; } :root[data-theme="light"] .diff.advanced { color: #be185d; }
.cdots { display: inline-flex; gap: 3px; } .cdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); } .cdots i.on { background: var(--primary); border-color: transparent; }
.tcard-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-top: 11px; border-top: 1px solid var(--border); }
.res { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 9px; font-size: .78rem; font-weight: 620; background: var(--surface-2); border: 1px solid transparent; color: var(--text); transition: all .2s; }
.res:hover { border-color: var(--primary); color: var(--primary-text); background: var(--primary-soft); }
.res.big { height: 44px; padding: 0 16px; font-size: .9rem; border-radius: 12px; border: 1px solid var(--border); flex: 1; justify-content: center; min-width: 120px; }
.rev-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px dashed var(--border); }
.rate-label { font-size: .74rem; color: var(--muted); margin-left: auto; }
.rate-mini { display: flex; gap: 4px; }
.rate-mini button { width: 36px; height: 34px; border-radius: 10px; background: var(--surface-2); font-size: 1.1rem; transition: transform .15s, background .2s; }
.rate-mini button:hover { transform: translateY(-2px) scale(1.08); background: var(--primary-soft); }

.rows { display: grid; gap: 8px; }
.trow { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--cat); transition: background .2s, border-color .2s; }
.trow:hover { background: var(--surface-2); }
.trow.is-done .trow-title { color: var(--muted); }
.trow-main { flex: 1; min-width: 0; display: grid; gap: 5px; }
.trow-title { font-weight: 620; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow-title:hover { color: var(--primary-text); }
.trow-sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.trow-res { display: flex; gap: 6px; }

.toolbar { display: grid; gap: 14px; padding: 14px 16px; }
.toolbar-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.toolbar-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 99px; background: var(--surface-2); border: 1px solid transparent; font-size: .83rem; font-weight: 600; color: var(--muted); transition: all .2s; white-space: nowrap; }
.chip-btn.sm { height: 28px; padding: 0 11px; font-size: .75rem; }
.chip-btn:hover { color: var(--text); border-color: var(--border-2); }
.chip-btn.on { background: color-mix(in srgb, var(--cat, var(--primary)) 20%, transparent); color: var(--text); border-color: color-mix(in srgb, var(--cat, var(--primary)) 55%, transparent); }
.seg-group { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--surface-2); flex-wrap: wrap; }
.seg-btn { height: 30px; padding: 0 12px; border-radius: 9px; font-size: .8rem; font-weight: 620; color: var(--muted); transition: all .2s; display: inline-flex; align-items: center; justify-content: center; }
.seg-btn:hover { color: var(--text); }
.seg-btn.on { background: var(--surface-solid); color: var(--text); box-shadow: 0 2px 8px -2px rgba(0, 0, 0, .35); }
.seg-group.icon-only .seg-btn { width: 34px; padding: 0; }
select, input[type="text"], input[type="number"], textarea { background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 0 12px; height: 36px; outline: none; transition: border-color .2s, box-shadow .2s; max-width: 100%; }
select { padding-right: 8px; cursor: pointer; }
select option, select optgroup { background: var(--surface-solid); color: var(--text); }
select:focus, input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.result-line { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .85rem; margin: -12px 0 -6px; min-height: 32px; }
.result-line b { color: var(--text); }

.empty { text-align: center; padding: 44px 20px; display: grid; justify-items: center; gap: 8px; color: var(--muted); }
.empty h3 { color: var(--text); font-size: 1.1rem; } .empty p { max-width: 46ch; } .empty .btn { margin-top: 8px; }
.empty-emoji { font-size: 2.6rem; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .3)); }
.card .empty { padding: 26px 10px; }

.cat-hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; background: linear-gradient(135deg, color-mix(in srgb, var(--cat) 22%, var(--surface-solid)), var(--surface)); border-color: color-mix(in srgb, var(--cat) 40%, var(--border)); padding: 24px; }
.cat-hero-ico { font-size: 2.6rem; width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; background: color-mix(in srgb, var(--cat) 22%, transparent); }
.cat-hero-text { flex: 1; min-width: 240px; }
.cat-hero-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.cat-hero-meta span { font-size: .78rem; font-weight: 600; padding: 4px 11px; border-radius: 99px; background: rgba(255, 255, 255, .07); color: var(--muted); border: 1px solid var(--border); }
:root[data-theme="light"] .cat-hero-meta span { background: rgba(255, 255, 255, .7); }
.cat-hero-side { display: grid; justify-items: center; gap: 12px; }

/* ---------- roadmap ---------- */
.timeline { position: relative; display: grid; gap: 16px; padding-left: 56px; }
.timeline::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 3px; border-radius: 3px; background: var(--surface-2); }
.tl-item { position: relative; }
.tl-marker { position: absolute; left: -56px; top: 14px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; background: var(--surface-solid); border: 3px solid var(--border-2); color: var(--muted); z-index: 1; transition: all .3s; }
.tl-item.complete .tl-marker { background: var(--success); border-color: var(--success); color: #fff; }
.tl-item.started .tl-marker { border-color: var(--cat); color: var(--text); }
.tl-item.current .tl-marker { border-color: var(--cat); color: var(--text); box-shadow: 0 0 0 6px color-mix(in srgb, var(--cat) 25%, transparent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 11px color-mix(in srgb, var(--cat) 6%, transparent); } }
.tl-item.complete .tl-card { opacity: .85; }
.tl-item.current .tl-card { border-color: color-mix(in srgb, var(--cat) 55%, var(--border)); }
.tl-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.tl-ico { font-size: 1.5rem; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: color-mix(in srgb, var(--cat) 18%, transparent); flex: none; }
.tl-title { flex: 1; min-width: 180px; } .tl-title p { color: var(--muted); font-size: .84rem; }
.tl-prog { display: flex; align-items: center; gap: 12px; margin: 14px 0; } .tl-prog .bar { flex: 1; } .tl-prog .bar i { background: var(--cat); }
.tl-prog span { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tl-list { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: grid; gap: 2px; max-height: 340px; overflow-y: auto; }
.tl-list li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 9px; font-size: .88rem; }
.tl-list li:hover { background: var(--surface-2); } .tl-list li span { cursor: pointer; flex: 1; } .tl-list li.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.tl-list li b { color: var(--primary-text); font-size: .78rem; margin-right: 4px; }

/* ---------- tabs, forecast ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; margin-bottom: -6px; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; font-weight: 620; color: var(--muted); white-space: nowrap; transition: color .2s; }
.tab:hover { color: var(--text); } .tab.on { color: var(--text); }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); }
.tab-n { font-size: .72rem; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); }
.fc { display: flex; gap: 12px; align-items: flex-end; height: 130px; }
.fc-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
.fc-n { font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; }
.fc-bar { flex: 1; width: 100%; max-width: 64px; display: flex; align-items: flex-end; background: var(--surface-2); border-radius: 10px; overflow: hidden; }
.fc-bar i { width: 100%; min-height: 3px; background: var(--primary); border-radius: 10px 10px 0 0; transition: height .7s var(--ease); }
.fc-col.hot .fc-bar i { background: var(--warning); } .fc-col small { font-size: .72rem; color: var(--muted); }

/* ---------- interview ---------- */
.drill { padding: 22px; display: grid; gap: 20px; }
.drill-controls { display: flex; gap: 14px 22px; flex-wrap: wrap; align-items: flex-end; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.selbox, .field { display: grid; gap: 6px; } .selbox span, .field > span { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: .86rem; height: 36px; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.knob { width: 38px; height: 22px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border-2); position: relative; transition: background .2s; flex: none; }
.knob::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .25s var(--ease), background .2s; }
.switch input:checked + .knob { background: var(--primary-btn); border-color: transparent; } .switch input:checked + .knob::after { transform: translateX(16px); background: #fff; }
.switch input:focus-visible + .knob { outline: 2px solid var(--primary); outline-offset: 2px; }
.drill-stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.drill-stats b { color: var(--text); font-size: 1.05rem; } .drill-stats .ok b { color: var(--success); } .drill-stats .bad b { color: var(--danger); }
.drill-stage { display: flex; gap: 30px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 26px; border-radius: 18px; background: linear-gradient(135deg, color-mix(in srgb, var(--cat) 14%, transparent), transparent 70%); border: 1px solid color-mix(in srgb, var(--cat) 30%, var(--border)); animation: rise .45s var(--ease); }
.drill-main { flex: 1; min-width: 280px; display: grid; gap: 14px; }
.drill-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.drill-title { font-size: clamp(1.4rem, 1.1rem + 1.2vw, 2rem); line-height: 1.2; letter-spacing: -.02em; }
.prompts { display: grid; gap: 8px; counter-reset: p; }
.prompts li { counter-increment: p; display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: .94rem; }
.prompts li::before { content: counter(p); flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 750; background: var(--primary-soft); color: var(--primary-text); }
.drill-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.clock { font-size: 2rem; font-weight: 780; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.drill-clock { display: grid; place-items: center; }
.res-big { display: flex; gap: 10px; flex-wrap: wrap; }
.rate-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 4px; }
.rate { display: grid; gap: 4px; text-align: center; padding: 18px 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); transition: transform .2s var(--ease), border-color .2s, background .2s; }
.rate b { font-size: 1.05rem; } .rate small { color: var(--muted); font-size: .76rem; }
.rate:hover { transform: translateY(-3px); }
.rate.bad:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.rate.mid:hover { border-color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, transparent); }
.rate.good:hover { border-color: var(--success); background: color-mix(in srgb, var(--success) 10%, transparent); }
.drill-intro { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 30px 10px; } .drill-intro p { max-width: 58ch; color: var(--muted); } .drill-intro .btn { margin-top: 8px; }
.rd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.rd { display: grid; gap: 10px; align-content: start; } .rd-head { display: flex; align-items: center; gap: 10px; } .rd-head h3 { flex: 1; } .rd-head b { font-size: 1.15rem; }
.rd .bar i { background: var(--cat); } .rd-weak { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; } .rd-weak small { color: var(--muted); }

/* ---------- insights ---------- */
.wk { display: flex; gap: 6px; align-items: flex-end; height: 200px; }
.wk-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; min-width: 0; }
.wk-stack { flex: 1; width: 100%; max-width: 42px; display: flex; flex-direction: column-reverse; justify-content: flex-start; background: var(--surface-2); border-radius: 9px; overflow: hidden; }
.wk-stack i { display: block; width: 100%; transition: height .7s var(--ease); } .wk-stack .done { background: var(--primary); } .wk-stack .rev { background: #f59e0b; }
.wk-col small { font-size: .66rem; color: var(--muted); white-space: nowrap; }

/* ---------- layers ---------- */
.overlay { position: fixed; inset: 0; z-index: 70; background: rgba(5, 7, 15, .55); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .3s; }
.overlay.show { opacity: 1; pointer-events: auto; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 80; width: min(540px, 100vw); display: flex; flex-direction: column; background: var(--surface-solid); border-left: 1px solid var(--border-2); box-shadow: var(--shadow-lg); transform: translateX(104%); visibility: hidden; transition: transform .4s var(--ease), visibility 0s .4s; }
.panel.open { transform: none; visibility: visible; transition: transform .4s var(--ease); }
.panel-head { display: flex; justify-content: space-between; gap: 12px; padding: 20px 22px 16px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, color-mix(in srgb, var(--cat) 16%, transparent), transparent); }
.panel-head h2 { font-size: 1.3rem; line-height: 1.3; margin-top: 10px; letter-spacing: -.015em; }
.panel-body { flex: 1; overflow-y: auto; padding: 20px 22px 28px; }
.panel-links { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.panel-status { display: flex; gap: 8px; flex-wrap: wrap; }
.panel-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }

  refresh: '<path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/>',
  home: '<path d="M3 11 12 3l9 8M5 10v10h5v-6h4v6h5V10"/>',
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/>',
  command: '<path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/>',
  external: '<path d="M14 4h6v6M20 4 10 14M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  shuffle: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>'
};
const icon = (n, s = 18, cls = '') => `<svg class="ico ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- topics ---------- */
const NUM_RE = /^(\d+(?:\s*[-–]\s*\d+)?)\.\s+(.*)$/;
const TOPICS = rawLinks.map((row, idx) => {
  const defs = catDefaults[row[2]] || {};
  const m = NUM_RE.exec(row[1]);
  return {
    id: row[0],
    order: idx,
    title: row[1],
    num: m ? m[1].replace(/\s+/g, '') : '',
    name: m ? m[2] : row[1],
    category: row[2],
    pdfLink: row[3] || '',
    oneNoteLink: row[4] || defs.note || '',
    gitLink: row[5] || defs.git || '',
    difficulty: row[2] === 'HLD' || row[2] === 'LLD' ? 'Advanced' : 'Intermediate',
    duration: '2h'
  };
});
const CATEGORIES = (() => {
  const seen = new Set(TOPICS.map(t => t.category));
  const out = ROADMAP_ORDER.filter(c => seen.has(c));
  seen.forEach(c => { if (!out.includes(c)) out.push(c); });
  return out;
})();

/* ---------- achievements ---------- */
const ACHIEVEMENTS = [
  { id: 'first', icon: '🌱', name: 'First Step', desc: 'Complete your first topic', prog: m => [m.done, 1] },
  { id: 'ten', icon: '🚀', name: 'Getting Rolling', desc: 'Complete 10 topics', prog: m => [m.done, 10] },
  { id: 'fifty', icon: '🏅', name: 'Half Century', desc: 'Complete 50 topics', prog: m => [m.done, 50] },
  { id: 'hundred', icon: '🏆', name: 'Century Club', desc: 'Complete 100 topics', prog: m => [m.done, 100] },
  { id: 'streak3', icon: '🔥', name: 'On Fire', desc: 'Reach a 3-day streak', prog: m => [m.best, 3] },
  { id: 'streak7', icon: '⚔️', name: 'Week Warrior', desc: 'Reach a 7-day streak', prog: m => [m.best, 7] },
  { id: 'streak30', icon: '🛡️', name: 'Unstoppable', desc: 'Reach a 30-day streak', prog: m => [m.best, 30] },
  { id: 'cat', icon: '🎯', name: 'Category Champion', desc: 'Finish every topic in a category', prog: m => [m.catDone, 1] },
  { id: 'ready10', icon: '💼', name: 'Interview Ready', desc: 'Reach confidence 4+ on 10 topics', prog: m => [m.ready, 10] },
  { id: 'notes5', icon: '📝', name: 'Note Taker', desc: 'Write notes on 5 topics', prog: m => [m.notes, 5] },
  { id: 'focus60', icon: '⏱️', name: 'Deep Focus', desc: 'Log 60 focus minutes', prog: m => [m.minutes, 60] },
  { id: 'focus300', icon: '🧘', name: 'Flow State', desc: 'Log 5 hours of focus time', prog: m => [m.minutes, 300] },
  { id: 'rev25', icon: '🔁', name: 'Repetition Pays', desc: 'Log 25 revisions', prog: m => [m.revs, 25] },
  { id: 'owl', icon: '🦉', name: 'Night Owl', desc: 'Study after 10 PM', prog: m => [m.night ? 1 : 0, 1] }
];

/* =========================================================
   Store
   ========================================================= */
class Store {
  constructor() {
    const stored = readJSON(LS.progress, {});
    this.log = new Set(readJSON(LS.log, []));
    this.activity = readJSON(LS.activity, {});
    this.ach = readJSON(LS.ach, {});
    this.flags = readJSON(LS.flags, {});
    this.settings = Object.assign({ theme: 'dark', hue: 239, dailyGoal: 3, focusMin: 25, view: 'grid', name: '', sidebar: true }, readJSON(LS.settings, {}));
    this.listeners = new Set();

    let migrated = false;
    this.topics = TOPICS.map(t => {
      const s = stored[t.id] || {};
      const topic = {
        ...t,
        completed: !!s.completed,
        favorite: !!s.favorite,
        confidence: s.confidence || 1,
        revisionCount: s.revisionCount || 0,
        notes: s.notes || '',
        lastRevised: s.lastRevised || null,
        lastTs: s.lastTs || null,
        completedAt: s.completedAt || null,
        minutes: s.minutes || 0
      };
      /* topics completed in the old dashboard have no timestamp: schedule them from today */
      if (topic.completed && !topic.lastTs) { topic.lastTs = Date.now(); migrated = true; }
      return topic;
    });
    this.byId = new Map(this.topics.map(t => [t.id, t]));
    this.unlockNew(true);
    if (migrated || !Object.keys(this.ach).length) this.save();
  }

  /* ----- persistence / events ----- */
  progressMap() {
    const o = {};
    this.topics.forEach(t => {
      o[t.id] = { completed: t.completed, favorite: t.favorite, confidence: t.confidence, revisionCount: t.revisionCount, notes: t.notes, lastRevised: t.lastRevised, lastTs: t.lastTs, completedAt: t.completedAt, minutes: t.minutes };
    });
    return o;
  }
  save() {
    writeJSON(LS.progress, this.progressMap());
    writeJSON(LS.log, [...this.log]);
    writeJSON(LS.activity, this.activity);
    writeJSON(LS.flags, this.flags);
    writeJSON(LS.ach, this.ach);
  }
  saveSettings() { writeJSON(LS.settings, this.settings); }
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit(fresh = []) { this.listeners.forEach(fn => fn(fresh)); }
  commit() { this.save(); const fresh = this.unlockNew(); if (fresh.length) writeJSON(LS.ach, this.ach); this.emit(fresh); }

  /* ----- activity ----- */
  bump(field, n) {
    const k = dayKey();
    const a = this.activity[k] || (this.activity[k] = { done: 0, rev: 0, min: 0 });
    a[field] = Math.max(0, (a[field] || 0) + n);
    if (n > 0) {
      this.log.add(k);
      const h = new Date().getHours();
      if (h >= 22 || h < 4) this.flags.owl = true;
    } else if (a.done + a.rev + a.min === 0) {
      delete this.activity[k];
      this.log.delete(k);
    }
  }
  scoreOf(key) {
    const a = this.activity[key];
    let s = a ? (a.done || 0) + (a.rev || 0) + Math.floor((a.min || 0) / 20) : 0;
    if (!s && (this.log.has(key) || (a && (a.done + a.rev + a.min) > 0))) s = 1;
    return s;
  }
  activeDays() {
    const s = new Set(this.log);
    for (const [k, a] of Object.entries(this.activity)) if ((a.done || 0) + (a.rev || 0) + (a.min || 0) > 0) s.add(k);
    return s;
  }
  streak() {
    const days = this.activeDays();
    let d = startOfDay();
    const todayDone = days.has(dayKey(d));
    if (!todayDone) d = addDays(d, -1);
    let current = 0;
    while (days.has(dayKey(d))) { current++; d = addDays(d, -1); }
    let best = 0, run = 0, prev = null;
    [...days].sort().forEach(k => {
      const dt = parseKey(k);
      run = prev && Math.round((dt - prev) / DAY_MS) === 1 ? run + 1 : 1;
      best = Math.max(best, run);
      prev = dt;
    });
    return { current, best: Math.max(best, current), todayDone, active: days.size };
  }

  /* ----- mutations ----- */
  toggleComplete(id) {
    const t = this.byId.get(id); if (!t) return null;
    t.completed = !t.completed;
    let catDone = false;
    if (t.completed) {
      t.completedAt = Date.now();
      t.lastTs = t.completedAt;
      this.bump('done', 1);
      catDone = this.topics.filter(x => x.category === t.category).every(x => x.completed);
    } else {
      if (t.completedAt && dayKey(new Date(t.completedAt)) === dayKey()) this.bump('done', -1);
      t.completedAt = null;
    }
    this.commit();
    return { completed: t.completed, catDone };
  }
  toggleFavorite(id) { const t = this.byId.get(id); if (t) { t.favorite = !t.favorite; this.commit(); } }
  setConfidence(id, val) {
    const t = this.byId.get(id); if (!t) return;
    t.confidence = clamp(val, 1, 5);
    if (t.completed) t.lastTs = Date.now();
    this.commit();
  }
  logRevision(id) {
    const t = this.byId.get(id); if (!t) return;
    t.revisionCount++; t.lastTs = Date.now(); t.lastRevised = new Date().toLocaleDateString();
    this.bump('rev', 1);
    this.commit();
  }
  rate(id, verdict) {
    const t = this.byId.get(id); if (!t) return null;
    const before = t.confidence;
    t.confidence = clamp(t.confidence + ({ nailed: 1, okay: 0, missed: -1 }[verdict] || 0), 1, 5);
    t.revisionCount++; t.lastTs = Date.now(); t.lastRevised = new Date().toLocaleDateString();
    this.bump('rev', 1);
    this.commit();
    return { before, after: t.confidence };
  }
  setNotes(id, text) {
    const t = this.byId.get(id); if (!t) return;
    t.notes = text;
    this.save();
    const fresh = this.unlockNew();
    if (fresh.length) { writeJSON(LS.ach, this.ach); this.emit(fresh); }
  }
  addMinutes(id, min) {
    if (min <= 0) return;
    const t = id && this.byId.get(id);
    if (t) t.minutes += min;
    this.bump('min', min);
    this.commit();
  }

  /* ----- queries ----- */
  neighbors(id) {
    const t = this.byId.get(id);
    const list = this.topics.filter(x => x.category === t.category);
    const i = list.indexOf(t);
    return { prev: list[i - 1] || null, next: list[i + 1] || null, index: i + 1, total: list.length };
  }
  nextUp() {
    for (const c of CATEGORIES) { const t = this.topics.find(x => x.category === c && !x.completed); if (t) return t; }
    return null;
  }
  dueAt(t) { if (!t.completed) return null; return (t.lastTs || t.completedAt || Date.now()) + SRS_DAYS[t.confidence] * DAY_MS; }
  isDue(t) { const d = this.dueAt(t); return d !== null && d <= Date.now(); }
  dueLabel(t) {
    const d = this.dueAt(t); if (d === null) return '';
    const now = Date.now();
    if (d <= now) { const n = Math.floor((now - d) / DAY_MS); return n < 1 ? 'Due today' : `${n}d overdue`; }
    const n = Math.ceil((d - now) / DAY_MS);
    return n === 1 ? 'Due tomorrow' : `Due in ${n}d`;
  }
  dueTopics() { return this.topics.filter(t => this.isDue(t)).sort((a, b) => this.dueAt(a) - this.dueAt(b)); }
  forecast(days = 7) {
    const out = Array(days).fill(0);
    const today = startOfDay().getTime(), endToday = today + DAY_MS;
    this.topics.forEach(t => {
      const d = this.dueAt(t); if (d === null) return;
      const off = d < endToday ? 0 : Math.floor((d - today) / DAY_MS);
      if (off < days) out[off]++;
    });
    return out;
  }
  catStats(cat) {
    const list = this.topics.filter(t => t.category === cat);
    const total = list.length, done = list.filter(t => t.completed).length;
    const ready = list.filter(t => t.completed && t.confidence >= 4).length;
    const readyAny = list.filter(t => t.confidence >= 4).length;
    const avg = total ? list.reduce((a, t) => a + t.confidence, 0) / total : 0;
    return { total, done, ready, readyAny, pct: total ? Math.round(done / total * 100) : 0, minutes: list.reduce((a, t) => a + t.minutes, 0), avg };
  }
  stats() {
    const T = this.topics, total = T.length;
    const done = T.filter(t => t.completed).length;
    return {
      total, done,
      ready: T.filter(t => t.confidence >= 4).length,
      revs: T.filter(t => t.completed && t.confidence < 4).length,
      due: this.dueTopics().length,
      favs: T.filter(t => t.favorite).length,
      minutes: T.reduce((a, t) => a + t.minutes, 0),
      notes: T.filter(t => t.notes.trim()).length,
      revCount: T.reduce((a, t) => a + t.revisionCount, 0),
      prog: total ? Math.round(done / total * 100) : 0
    };
  }
  confDist() { const d = [0, 0, 0, 0, 0]; this.topics.forEach(t => d[t.confidence - 1]++); return d; }
  heat(weeks = 20) {
    const start = addDays(startOfWeek(), -(weeks - 1) * 7), today = startOfDay();
    const cells = [];
    for (let i = 0; i < weeks * 7; i++) {
      const d = addDays(start, i), key = dayKey(d);
      const a = this.activity[key] || { done: 0, rev: 0, min: 0 };
      const score = this.scoreOf(key);
      cells.push({ key, date: d, score, a, future: d > today, level: score === 0 ? 0 : score === 1 ? 1 : score <= 3 ? 2 : score <= 5 ? 3 : 4 });
    }
    return { cells, weeks, start };
  }
  weekly(n = 12) {
    const out = [];
    for (let w = n - 1; w >= 0; w--) {
      const ws = addDays(startOfWeek(), -w * 7);
      const row = { start: ws, done: 0, rev: 0, min: 0 };
      for (let i = 0; i < 7; i++) { const a = this.activity[dayKey(addDays(ws, i))]; if (a) { row.done += a.done || 0; row.rev += a.rev || 0; row.min += a.min || 0; } }
      out.push(row);
    }
    return out;
  }

  /* ----- achievements ----- */
  metrics() {
    const s = this.stats(), st = this.streak();
    return {
      done: s.done, ready: s.ready, notes: s.notes, minutes: s.minutes, revs: s.revCount,
      best: st.best, current: st.current,
      catDone: CATEGORIES.filter(c => { const x = this.catStats(c); return x.total && x.done === x.total; }).length,
      night: !!this.flags.owl
    };
  }
  achievementState() {
    const m = this.metrics();
    return ACHIEVEMENTS.map(a => { const [cur, goal] = a.prog(m); return { ...a, cur: Math.min(cur, goal), goal, unlocked: !!this.ach[a.id], at: this.ach[a.id] || 0 }; });
  }
  unlockNew(silent = false) {
    const m = this.metrics(), fresh = [];
    for (const a of ACHIEVEMENTS) {
      const [cur, goal] = a.prog(m);
      if (!this.ach[a.id] && cur >= goal) { this.ach[a.id] = Date.now(); fresh.push(a); }
    }
    return silent ? [] : fresh;
  }

  /* ----- data management ----- */
  exportData() {
    return { app: 'devpath', version: 2, exportedAt: new Date().toISOString(), progress: this.progressMap(), log: [...this.log], activity: this.activity, settings: this.settings, achievements: this.ach, flags: this.flags };
  }
  importData(obj) {
    if (!obj || typeof obj !== 'object' || !obj.progress || typeof obj.progress !== 'object') throw new Error('This file is not a DevPath backup.');
    writeJSON(LS.progress, obj.progress);
    writeJSON(LS.log, Array.isArray(obj.log) ? obj.log : []);
    writeJSON(LS.activity, obj.activity || {});
    if (obj.settings) writeJSON(LS.settings, obj.settings);
    writeJSON(LS.ach, obj.achievements || {});
    writeJSON(LS.flags, obj.flags || {});
  }
  resetProgress() {
    [LS.progress, LS.log, LS.activity, LS.ach, LS.flags, LS.timer].forEach(k => { try { localStorage.removeItem(k); } catch { /* ignore */ } });
  }
  notesMarkdown() {
    const withNotes = this.topics.filter(t => t.notes.trim());
    if (!withNotes.length) return '';
    let md = `# DevPath notes\n\n_Exported ${new Date().toLocaleString()}_\n`;
    CATEGORIES.forEach(c => {
      const items = withNotes.filter(t => t.category === c);
      if (!items.length) return;
      md += `\n## ${c}\n`;
      items.forEach(t => { md += `\n### ${t.title}\n\n${t.notes.trim()}\n`; });
    });
    return md;
  }
}

const store = new Store();

</script>
  <script>
'use strict';
/* =========================================================
   DevPath views: pure functions that return HTML strings.
   Event wiring lives in app.js (data-action delegation).
   ========================================================= */

const ui = {
  route: { page: 'dashboard', cat: null },
  filters: { q: '', cat: 'all', status: 'all', diff: 'all', sort: 'course' },
  view: store.settings.view || 'grid',
  rtab: 'due',
  itab: 'drill',
  expanded: new Set(),
  panelId: null,
  drill: {
    scope: 'all', includeAll: false, phase: 'idle', topic: null, prompts: [],
    total: 120, left: 120, running: false, timer: null, lastId: null,
    session: { n: 0, nailed: 0, okay: 0, missed: 0 }
  }
};

const Views = {};
const catHref = c => `#/category/${encodeURIComponent(c)}`;
const mmss = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;

/* ---------- small components ---------- */
const hl = (s, q) => {
  s = String(s);
  const toks = (q || '').toLowerCase().split(/\s+/).filter(Boolean).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!toks.length) return esc(s);
  return s.split(new RegExp('(' + toks.join('|') + ')', 'gi')).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join('');
};

const confDots = t => `<span class="cdots" title="${CONF_LABELS[t.confidence]}" aria-label="Confidence: ${CONF_LABELS[t.confidence]}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= t.confidence ? 'on' : ''}"></i>`).join('')}</span>`;

const resLinks = t => [['pdfLink', 'file', 'PDF'], ['oneNoteLink', 'note', 'OneNote'], ['gitLink', 'code', 'Git']]
  .filter(([k]) => t[k])
  .map(([k, ic, l]) => `<a class="res" href="${esc(t[k])}" target="_blank" rel="noopener noreferrer" title="Open ${l} in a new tab">${icon(ic, 14)}<span>${l}</span></a>`).join('');

function ring({ pct, size = 120, stroke = 10, color = 'var(--primary)', label = '', sub = '' }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, h = size / 2;
  const off = c * (1 - clamp(pct, 0, 100) / 100);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="ring-bg" cx="${h}" cy="${h}" r="${r}" stroke-width="${stroke}"/><circle class="ring-fg" cx="${h}" cy="${h}" r="${r}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="--circ:${c};stroke:${color}" transform="rotate(-90 ${h} ${h})"/></svg><div class="ring-label">${label}${sub ? `<small>${sub}</small>` : ''}</div></div>`;
}

const pageHead = ({ eyebrow = '', title, sub = '', actions = '' }) =>
  `<header class="page-head"><div>${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}<h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${actions ? `<div class="page-actions">${actions}</div>` : ''}</header>`;

const emptyState = (emoji, title, text, action = '') =>
  `<div class="empty"><div class="empty-emoji">${emoji}</div><h3>${title}</h3><p>${text}</p>${action}</div>`;

function card(t, o = {}) {
  const m = catMeta(t.category), due = store.isDue(t);
  return `<article class="tcard${t.completed ? ' is-done' : ''}" data-id="${t.id}" style="--cat:${m.color}">
    <div class="tcard-top">
      <button class="check${t.completed ? ' on' : ''}" data-action="toggle" data-id="${t.id}" aria-pressed="${t.completed}" aria-label="${t.completed ? 'Mark incomplete' : 'Mark complete'}: ${esc(t.title)}">${icon('check', 14)}</button>
      <span class="tag"><i>${m.icon}</i>${esc(t.category)}</span>
      <span class="spacer"></span>
      ${due ? '<span class="pill warn" title="Spaced-repetition review is due">Due</span>' : ''}
      <button class="star${t.favorite ? ' on' : ''}" data-action="fav" data-id="${t.id}" aria-pressed="${t.favorite}" aria-label="Favorite: ${esc(t.title)}">${icon('star', 16)}</button>
    </div>
    <h3 class="tcard-title" data-action="open" data-id="${t.id}" tabindex="0" role="button">${t.num ? `<span class="num">${esc(t.num)}</span>` : ''}${hl(t.name, o.q)}</h3>
    <div class="tcard-meta"><span class="meta-i">${icon('clock', 13)}${esc(t.duration)}</span><span class="diff ${t.difficulty.toLowerCase()}">${t.difficulty}</span>${confDots(t)}${t.notes.trim() ? `<span class="meta-i has-notes" title="You wrote notes here">${icon('edit', 13)}</span>` : ''}</div>
    <div class="tcard-actions">${resLinks(t)}<button class="btn sm push" data-action="open" data-id="${t.id}">Details</button></div>
    ${o.extra || ''}
  </article>`;
}

function row(t, o = {}) {
  const m = catMeta(t.category);
  return `<article class="trow${t.completed ? ' is-done' : ''}" data-id="${t.id}" style="--cat:${m.color}">
    <button class="check${t.completed ? ' on' : ''}" data-action="toggle" data-id="${t.id}" aria-pressed="${t.completed}" aria-label="${t.completed ? 'Mark incomplete' : 'Mark complete'}: ${esc(t.title)}">${icon('check', 14)}</button>

const greeting = () => {
  const h = new Date().getHours();
  return h < 5 ? 'Burning the midnight oil' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 22 ? 'Good evening' : 'Late-night grind';
};

function etaText(remaining, perDay) {
  if (!remaining) return 'All topics complete';
  const days = Math.ceil(remaining / perDay), d = addDays(new Date(), days);
  return `${plural(remaining, 'topic')} left · ~${days} days at ${perDay}/day (${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })})`;
}

function heatmapHTML(weeks = 20) {
  const h = store.heat(weeks);
  let months = '';
  for (let c = 0; c < weeks; c++) {
    const d = addDays(h.start, c * 7), pv = addDays(h.start, (c - 1) * 7);
    months += `<span>${c === 0 || d.getMonth() !== pv.getMonth() ? d.toLocaleDateString(undefined, { month: 'short' }) : ''}</span>`;
  }
  const cells = h.cells.map(c => {
    const parts = [];
    if (c.a.done) parts.push(plural(c.a.done, 'topic'));
    if (c.a.rev) parts.push(plural(c.a.rev, 'revision'));
    if (c.a.min) parts.push(`${c.a.min} min focus`);
    const txt = parts.length ? parts.join(', ') : c.score ? 'Studied' : 'No activity';
    return `<i class="hc lv${c.level}${c.future ? ' fut' : ''}" title="${esc(c.date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }))}: ${esc(txt)}"></i>`;
  }).join('');
  const active = h.cells.filter(c => c.score > 0).length;
  return `<div class="heat-wrap"><div class="heat-months" style="--weeks:${weeks}">${months}</div><div class="heat" style="--weeks:${weeks}" role="img" aria-label="Activity over the last ${weeks} weeks: ${active} active days">${cells}</div></div>
    <div class="heat-foot"><span>${plural(active, 'active day')} in the last ${weeks} weeks</span><span class="heat-legend">Less ${[0, 1, 2, 3, 4].map(l => `<i class="hc lv${l}"></i>`).join('')} More</span></div>`;
}

   Library / Category
   ========================================================= */
function filteredTopics() {
  const f = ui.filters;
  let list = store.topics.slice();
  if (f.cat !== 'all') list = list.filter(t => t.category === f.cat);
  if (f.status === 'todo') list = list.filter(t => !t.completed);
  else if (f.status === 'done') list = list.filter(t => t.completed);
  else if (f.status === 'fav') list = list.filter(t => t.favorite);
  else if (f.status === 'due') list = list.filter(t => store.isDue(t));
  else if (f.status === 'ready') list = list.filter(t => t.confidence >= 4);
  if (f.diff !== 'all') list = list.filter(t => t.difficulty === f.diff);
  const toks = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  if (toks.length) {
    list = list.filter(t => {
      const hay = `${t.title} ${t.category} ${t.difficulty} ${t.completed ? 'done completed' : 'todo pending'} ${t.favorite ? 'favorite fav' : ''} ${t.notes}`.toLowerCase();
      return toks.every(k => hay.includes(k));
    });
  }
  const sorts = {
    course: (a, b) => a.order - b.order,
    az: (a, b) => a.name.localeCompare(b.name),
    'conf-asc': (a, b) => a.confidence - b.confidence || a.order - b.order,
    'conf-desc': (a, b) => b.confidence - a.confidence || a.order - b.order,
    recent: (a, b) => Math.max(b.lastTs || 0, b.completedAt || 0) - Math.max(a.lastTs || 0, a.completedAt || 0) || a.order - b.order
  };
  return list.sort(sorts[f.sort] || sorts.course);
}

    sub: curIdx === -1 ? 'Every stop on the path is complete. Impressive.' : `Step ${curIdx + 1} of ${stats.length}: <b>${esc(stats[curIdx].c)}</b> · about ${hoursLeft}h of material left · ${etaText(s.total - s.done, goal)}`
  })}
  <ol class="timeline">${items}</ol>`;
};

/* =========================================================
   Revision
   ========================================================= */
Views.revision = () => {
  const due = store.dueTopics();
  const weak = store.topics.filter(t => t.completed && t.confidence < 4).sort((a, b) => a.confidence - b.confidence || store.dueAt(a) - store.dueAt(b));
  const all = store.topics.filter(t => t.completed).sort((a, b) => store.dueAt(a) - store.dueAt(b));
  const tabs = [['due', 'Due now', due], ['weak', 'Needs work', weak], ['all', 'Scheduled', all]];
  const list = (tabs.find(t => t[0] === ui.rtab) || tabs[0])[2];
  const fc = store.forecast(7), mx = Math.max(1, ...fc);
  const dayLbl = i => i === 0 ? 'Today' : i === 1 ? 'Tmrw' : addDays(new Date(), i).toLocaleDateString(undefined, { weekday: 'short' });
  const extra = t => `<div class="rev-foot"><span class="pill ${store.isDue(t) ? 'warn' : ''}">${esc(store.dueLabel(t))}</span><span class="rate-label">How well do you recall it?</span><div class="rate-mini"><button data-action="rate" data-id="${t.id}" data-v="missed" title="Shaky: confidence −1">😕</button><button data-action="rate" data-id="${t.id}" data-v="okay" title="Okay: keep confidence">🙂</button><button data-action="rate" data-id="${t.id}" data-v="nailed" title="Solid: confidence +1">💪</button></div></div>`;
  return `${pageHead({ eyebrow: 'Spaced repetition', title: 'Revision tracker', sub: 'Completed topics resurface on a schedule based on your confidence (1 day at level 1 up to 30 days at level 5). Rate honestly after each review.' })}
  <section class="card forecast"><div class="card-head"><h3>Next 7 days</h3><small class="muted">reviews coming due</small></div>
    <div class="fc">${fc.map((n, i) => `<div class="fc-col${i === 0 && n ? ' hot' : ''}"><span class="fc-n">${n}</span><div class="fc-bar"><i style="height:${n / mx * 100}%"></i></div><small>${dayLbl(i)}</small></div>`).join('')}</div></section>
  <div class="tabs" role="tablist">${tabs.map(([k, l, a]) => `<button role="tab" aria-selected="${ui.rtab === k}" class="tab${ui.rtab === k ? ' on' : ''}" data-action="tab" data-group="rtab" data-val="${k}">${l}<span class="tab-n">${a.length}</span></button>`).join('')}</div>
  ${list.length ? gridOf(list, { extra }) : emptyState(ui.rtab === 'due' ? '🎉' : '📭', ui.rtab === 'due' ? 'You are all caught up' : 'Nothing here yet', ui.rtab === 'due' ? 'No reviews are due right now. Check the forecast above to see what is coming.' : 'Mark topics complete and they will be scheduled for review automatically.')}`;
};

/* =========================================================
   Interview mode (mock drill + readiness)
   ========================================================= */
const DRILL_GENERIC = [
  'Explain it in 60 seconds as if to a hiring manager.',
  'What problem does it solve, and what are the trade-offs?',
  'Give a concrete real-project example of using it.',
  'What can go wrong in production, and how would you debug it?',
  'How does it differ from the closest alternative?',
  'Walk through what happens internally, step by step.',
  'How would an interviewer test your depth on this topic?'
];
const DRILL_BY_CAT = {
  'Java': ['Which JVM or memory aspects are involved?', 'Write a tiny code snippet from memory.', 'What changed across Java versions here?'],
  'Spring Boot': ['Which beans, proxies or auto-configuration are involved under the hood?', 'How would you configure and test this?', 'What are the common pitfalls and how do you avoid them?'],
  'JUnit5 & Mockito': ['Sketch a test from memory: arrange, act, assert.', 'What would you mock here, and what would you leave real?'],
  'Microservices': ['Which failure mode does this guard against?', 'Which settings or thresholds would you tune, and why?', 'How would you observe it in production?'],
  'Event Driven Architecture': ['What delivery guarantees apply (at-most, at-least, exactly once)?', 'How do ordering, partitions and retries interact here?', 'How would you handle duplicates and failures?'],
  'LLD': ['Name the classes, interfaces and relationships.', 'Which design patterns apply, and why?', 'How would you extend it without modifying existing code?'],
  'HLD': ['State your assumptions and estimate the scale.', 'Where are the bottlenecks and single points of failure?', 'Which datastore and consistency trade-offs would you choose?'],
  'Git': ['Which commands would you run, and what do they change under the hood?', 'How would you recover from a mistake here?'],
  'AWS': ['Which services would you pick, and what are the cost and security trade-offs?'],
  'Spring AI': ['How would you structure the integration and handle latency and failures?']
};

function drillPool() {
  const d = ui.drill;
  return store.topics.filter(t => (d.scope === 'all' || t.category === d.scope) && (d.includeAll || t.completed));
}
function pickPrompts(cat) {
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  const specific = shuffle(DRILL_BY_CAT[cat] || []).slice(0, 1);
  return [...specific, ...shuffle(DRILL_GENERIC).slice(0, 3 - specific.length)];
}
function drillNext() {
  const d = ui.drill;
  stopDrillTimer();
  let pool = drillPool();
  if (!pool.length) { d.topic = null; d.phase = 'empty'; return; }
  if (pool.length > 1) pool = pool.filter(t => t.id !== d.lastId);
  const w = pool.map(t => Math.max(0.5, 6 - t.confidence + (store.isDue(t) ? 3 : 0)));
  let r = Math.random() * w.reduce((a, b) => a + b, 0), pick = pool[pool.length - 1];
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) { pick = pool[i]; break; } }
  d.topic = pick; d.lastId = pick.id; d.prompts = pickPrompts(pick.category);
  d.left = d.total; d.running = false; d.phase = 'ask';
}
function stopDrillTimer() {
  const d = ui.drill;
  if (d.timer) { clearInterval(d.timer); d.timer = null; }
  d.running = false;
}

function drillHTML() {
  const d = ui.drill, ses = d.session, t = d.topic;
  const scopeOpts = ['all', ...CATEGORIES].map(c => `<option value="${esc(c)}"${d.scope === c ? ' selected' : ''}>${c === 'all' ? 'All categories' : esc(c)}</option>`).join('');
  const controls = `<div class="drill-controls">
    <label class="selbox"><span>Scope</span><select data-change="drill-scope">${scopeOpts}</select></label>
    <label class="switch"><input type="checkbox" data-change="drill-all"${d.includeAll ? ' checked' : ''}><span class="knob"></span><span>Include topics I haven't completed</span></label>
    <div class="seg-group" role="group" aria-label="Answer time">${[60, 120, 180, 300].map(s => `<button class="seg-btn${d.total === s ? ' on' : ''}" data-action="drill-time" data-val="${s}">${s / 60} min</button>`).join('')}</div></div>`;
  const stats = `<div class="drill-stats"><span><b>${ses.n}</b> answered</span><span class="ok"><b>${ses.nailed}</b> nailed</span><span><b>${ses.okay}</b> okay</span><span class="bad"><b>${ses.missed}</b> missed</span></div>`;
  let stage;
  if (d.phase === 'ask' && t) {
    const m = catMeta(t.category);
    stage = `<div class="drill-stage" style="--cat:${m.color}">
      <div class="drill-main">
        <div class="drill-tags"><span class="tag"><i>${m.icon}</i>${esc(t.category)}</span><span class="pill">${CONF_EMOJI[t.confidence]} ${CONF_LABELS[t.confidence]}</span>${store.isDue(t) ? '<span class="pill warn">Review due</span>' : ''}</div>
        <h2 class="drill-title">${t.num ? `<span class="num">${esc(t.num)}</span>` : ''}${esc(t.name)}</h2>

        <ol class="prompts">${d.prompts.map(p => `<li>${esc(p)}</li>`).join('')}</ol>
        <div class="drill-actions">

          <button class="btn lg" data-action="drill-reveal">I'm done: check &amp; rate</button>

        </div></div>
      <div class="drill-clock">${ring({ pct: d.left / d.total * 100, size: 150, stroke: 11, color: 'var(--cat)', label: `<span id="drillClock" class="clock">${mmss(d.left)}</span>`, sub: 'answer time' })}</div></div>`;
  } else if (d.phase === 'rate' && t) {
    const m = catMeta(t.category);
    stage = `<div class="drill-stage rate" style="--cat:${m.color}"><div class="drill-main">
      <div class="drill-tags"><span class="tag"><i>${m.icon}</i>${esc(t.category)}</span></div>
      <h2 class="drill-title">${t.num ? `<span class="num">${esc(t.num)}</span>` : ''}${esc(t.name)}</h2>

        <button class="rate good" data-action="drill-rate" data-v="nailed"><b>💪 Nailed it</b><small>Confidence +1 · review later <kbd>3</kbd></small></button>

  } else if (d.phase === 'empty') {

  } else {
    stage = `<div class="drill-intro"><div class="empty-emoji">🎤</div><h2>Mock interview drill</h2><p>You get a random topic and a few interviewer-style prompts, a timer, then rate how it went. Weak and overdue topics are picked more often, and your rating updates your confidence and revision schedule.</p>
      <p class="muted small">${plural(drillPool().length, 'topic')} in the pool${!drillPool().length ? '. Complete some topics or include uncompleted ones.' : ''}</p>
      <button class="btn primary lg" data-action="drill-start"${!drillPool().length ? ' disabled' : ''}>${icon('play', 15, 'ico-fill')} Start drill</button></div>`;
  }
  return `<div class="card drill">${controls}${stats}${stage}</div>`;
}

Views.interview = () => {
  const s = store.stats();

  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${ui.itab === k}" class="tab${ui.itab === k ? ' on' : ''}" data-action="tab" data-group="itab" data-val="${k}">${l}</button>`).join('')}</div>${body}`;
};

Views.insights = () => {
  const s = store.stats(), st = store.streak();
  const wk = store.weekly(12), mx = Math.max(1, ...wk.map(w => w.done + w.rev));
  const avg = (store.topics.reduce((a, t) => a + t.confidence, 0) / store.topics.length).toFixed(1);

};
