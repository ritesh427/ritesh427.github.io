<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DevPath · Developer Learning Dashboard</title>
  <meta name="description" content="Track your Java, Spring Boot, Microservices, Kafka, LLD and HLD interview preparation with spaced repetition, streaks and mock drills.">
  <meta name="theme-color" content="#0b0d17">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Cpath d='M18 5 8 18h7l-1 9 10-13h-7z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* apply saved theme before first paint (no flash) */
    try {
      var s = JSON.parse(localStorage.getItem('devpath_settings') || '{}');
      var t = s.theme || 'dark';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      if (s.hue) document.documentElement.style.setProperty('--hue', s.hue);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn only-mobile" data-action="menu" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button class="icon-btn only-desktop" data-action="collapse" aria-label="Toggle sidebar" title="Toggle sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        <div class="search" role="search">
          <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="globalSearch" type="search" placeholder="Search topics, categories…" aria-label="Search topics" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
        <div class="top-right">
          <div id="topStats"></div>
          <button class="icon-btn" data-action="palette" aria-label="Open command palette" title="Command palette (Ctrl K)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/></svg></button>
          <button class="icon-btn" id="themeBtn" data-action="theme" aria-label="Toggle theme"></button>
        </div>
      </header>
      <main id="main" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <nav id="tabbar" aria-label="Quick navigation"></nav>
  <div id="dock" class="dock" hidden aria-label="Focus timer"></div>
  <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" aria-hidden="true"></aside>
  <div id="overlay" class="overlay"></div>
  <div id="modal" hidden></div>
  <div id="palette" hidden></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <noscript><p style="padding:24px;font-family:sans-serif">DevPath needs JavaScript to run.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
