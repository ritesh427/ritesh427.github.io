const greeting = () => {
  const h = new Date().getHours();
  return h < 5 ? 'Burning the midnight oil' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 22 ? 'Good evening' : 'Late-night session';
};

function etaText(remaining, perDay) {
  if (!remaining) return 'All curriculum topics completed! 🎉';
  const days = Math.ceil(remaining / perDay), d = addDays(new Date(), days);
  return `${plural(remaining, 'topic')} left · ~${days} days at ${perDay}/day (${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })})`;
}

function heatmapHTML(weeks = 20) {
  const h = store.heat(weeks);
  let months = '';
  for (let c = 0; c < weeks; c++) {
    const d = addDays(h.start, c * 7), pv = addDays(h.start, (c - 1) * 7);
    months += `<span>${c === 0 || d.getMonth() !== pv.getMonth() ? d.toLocaleDateString(undefined, { month: 'short' }) : ''}</span>`;
  }
  const cells = h.cells.map(c => {
    const parts = [];
    if (c.a.done) parts.push(plural(c.a.done, 'topic'));
    if (c.a.rev) parts.push(plural(c.a.rev, 'revision'));
    if (c.a.min) parts.push(`${c.a.min} min focus`);
    const txt = parts.length ? parts.join(', ') : c.score ? 'Studied' : 'No activity';
    return `<i class="hc lv${c.level}${c.future ? ' fut' : ''}" title="${esc(c.date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }))}: ${esc(txt)}"></i>`;
  }).join('');
  const active = h.cells.filter(c => c.score > 0).length;
  return `<div class="heat-wrap">
    <div class="heat-months" style="--weeks:${weeks}">${months}</div>
    <div class="heat" style="--weeks:${weeks}" role="img" aria-label="Activity over the last ${weeks} weeks: ${active} active days">${cells}</div>
  </div>
  <div class="heat-foot">
    <span>${plural(active, 'active day')} in the last ${weeks} weeks</span>
    <span class="heat-legend">Less ${[0, 1, 2, 3, 4].map(l => `<i class="hc lv${l}"></i>`).join('')} More</span>
  </div>`;
}

function achCard(a) {
  const pct = Math.round(a.cur / a.goal * 100);
  return `<div class="ach${a.unlocked ? ' on' : ''}" title="${esc(a.desc)}">
    <span class="ach-ico">${a.icon}</span>
    <div>
      <b>${esc(a.name)}</b>
      <small>${esc(a.desc)}</small>
      ${a.unlocked ? `<em>Unlocked ${new Date(a.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</em>` : `<div class="bar thin"><i style="width:${pct}%"></i></div><em>${a.cur}/${a.goal}</em>`}
    </div>
  </div>`;
}

/* ----- Library & Category Views ----- */
function filteredTopics() {
  const f = ui.filters;
  let list = store.topics.slice();
  if (f.cat !== 'all') list = list.filter(t => t.category === f.cat);
  if (f.status === 'todo') list = list.filter(t => !t.completed);
  else if (f.status === 'done') list = list.filter(t => t.completed);
  else if (f.status === 'fav') list = list.filter(t => t.favorite);
  else if (f.status === 'due') list = list.filter(t => store.isDue(t));
  else if (f.status === 'ready') list = list.filter(t => t.confidence >= 4);
  if (f.diff !== 'all') list = list.filter(t => t.difficulty === f.diff);
  
  const toks = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  if (toks.length) {
    list = list.filter(t => {
      const hay = `${t.title} ${t.category} ${t.difficulty} ${t.completed ? 'done completed' : 'todo pending'} ${t.favorite ? 'favorite fav' : ''} ${t.notes}`.toLowerCase();
      return toks.every(k => hay.includes(k));
    });
  }

  const sorts = {
    course: (a, b) => a.order - b.order,
    az: (a, b) => a.name.localeCompare(b.name),
    'conf-asc': (a, b) => a.confidence - b.confidence || a.order - b.order,
    'conf-desc': (a, b) => b.confidence - a.confidence || a.order - b.order,

  };

}

  'Explain this concept in 60 seconds as if answering a Principal Engineer.',
  'What key engineering problem does this solve, and what are its critical trade-offs?',
  'Walk through a production scenario where this failed or caused a bottleneck.',
  'How does this pattern scale, and what are the concurrency or consistency pitfalls?',
  'What would you observe in telemetry (metrics/logs/traces) when this malfunctions?'
];

const DRILL_BY_CAT = {
  'Java': ['How does the JVM handle this in heap/stack memory?', 'What are the volatile, lock, or CAS synchronization mechanics?'],
  'Spring Boot': ['How does Spring manage the proxying or lifecycle under the hood?', 'What happens during failure injection or transaction rollback?'],
  'JUnit5 & Mockito': ['Sketch the Arrange-Act-Assert structure and explain what to verify vs stub.', 'How do you test timeouts, retries, and asynchronous boundaries?'],
  'Microservices': ['How does this prevent cascading failures across service boundaries?', 'What metric or threshold controls circuit opening or rate shedding?'],
  'Event Driven Architecture': ['Explain partition distribution, rebalancing, and idempotency keys.', 'How do you achieve exactly-once semantics end-to-end?'],
  'LLD': ['Which Design Patterns apply, and how do you adhere to Open-Closed Principle?', 'Draft the core interfaces and domain models from scratch.'],
  'HLD': ['Estimate the throughput, storage, and caching requirements (QPS & Latency).', 'Identify the single points of failure and failover mechanisms.']
};

function drillPool() {
  const d = ui.drill;
  return store.topics.filter(t => (d.scope === 'all' || t.category === d.scope) && (d.includeAll || t.completed));
}

function pickPrompts(cat) {
  const shuffleList = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  const specific = shuffleList(DRILL_BY_CAT[cat] || []).slice(0, 1);
  return [...specific, ...shuffleList(DRILL_GENERIC).slice(0, 3 - specific.length)];
}

function drillNext() {
  const d = ui.drill;
  stopDrillTimer();
  let pool = drillPool();
  if (!pool.length) { d.topic = null; d.phase = 'empty'; return; }
  if (pool.length > 1) pool = pool.filter(t => t.id !== d.lastId);
  const w = pool.map(t => Math.max(0.5, 6 - t.confidence + (store.isDue(t) ? 3 : 0)));
  let r = Math.random() * w.reduce((a, b) => a + b, 0), pick = pool[pool.length - 1];
  for (let i = 0; i < pool.length; i++) {
    r -= w[i];
    if (r <= 0) { pick = pool[i]; break; }
  }
  d.topic = pick;
  d.lastId = pick.id;
  d.prompts = pickPrompts(pick.category);
  d.left = d.total;
  d.running = false;
  d.phase = 'ask';
}

function stopDrillTimer() {
  const d = ui.drill;
  if (d.timer) { clearInterval(d.timer); d.timer = null; }
  d.running = false;
}

  <script>
/* --- js/quiz-ui.js --- */
'use strict';
/* =========================================================
   DevPath Quiz UI Renderer & Action Wiring
   ========================================================= */

const qzEl = () => document.getElementById('quiz');


/* ----- setup screen ----- */
function qzSetup(s, t) {
  const m = catMeta(t.category), st = Quiz.stats(t.id), lens = Quiz.lengths(t.id), bank = QB.count(t.id);
  const seg = (key, vals, cur, fmt) => `<div class="seg-group" role="group">${vals.map(v => `<button class="seg-btn${cur === v ? ' on' : ''}" data-action="qz-set" data-key="${key}" data-val="${v}">${fmt(v)}</button>`).join('')}</div>`;
  const need = Math.ceil(s.n * PASS_MARK / 100);

  return `<div class="qz-wrap" style="--cat:${m.color}">
    <div class="qz-top">
      <button class="icon-btn" data-action="qz-quit" aria-label="Close">${icon('x', 20)}</button>
      <span class="eyebrow">Knowledge Test Assessment</span>
    </div>
    <div class="card qz-hero">
      <div class="qz-hero-ico">${m.icon}</div>
      <div class="qz-hero-text">
        <span class="tag"><i>${m.icon}</i>${esc(t.category)}</span>
        <h1>${t.num ? `<span class="num">${esc(t.num)}</span>` : ''}${esc(t.name)}</h1>
        <div class="qz-chips">
          <span>${bank} questions in bank</span>
          ${st.attempts ? `<span>Best Score: ${st.best === null ? '—' : st.best + '%'}</span><span>${plural(st.attempts, 'attempt')}</span>` : '<span>First attempt</span>'}
          ${st.passed ? '<span class="ok">Topic Passed ✓</span>' : ''}
        </div>
      </div>
    </div>
    <div class="card qz-form">
      <div class="field">
        <span>Number of Questions</span>
        ${seg('n', lens, s.n, v => v)}
      </div>
      <div class="field">
        <span>Assessment Mode</span>
        <div class="qz-modes">
          <button class="qz-mode${s.mode === 'exam' ? ' on' : ''}" data-action="qz-set" data-key="mode" data-val="exam" aria-pressed="${s.mode === 'exam'}">
            <b>🎯 Exam Mode</b>
            <small>Score 80%+ to complete this topic. Answers revealed at the end. Leaving the tab twice fails the test.</small>
          </button>
          <button class="qz-mode${s.mode === 'practice' ? ' on' : ''}" data-action="qz-set" data-key="mode" data-val="practice" aria-pressed="${s.mode === 'practice'}">
            <b>📘 Practice Mode</b>
            <small>Untimed, relaxed learning. Instant step-by-step explanations after every question.</small>
          </button>
        </div>
      </div>
      <div class="field">
        <span>Timer per Question</span>
        ${seg('secs', [0, 20, 30, 45, 60], s.secs, v => v ? v + 's' : 'Untimed')}
        <small class="muted">Code execution questions automatically get +50% extra thinking time.</small>
      </div>
    </div>
    <div class="card qz-rules">
      <h3>Assessment Guidelines</h3>
      <ul>
        <li>Score <b>${PASS_MARK}% or higher</b> (${need} of ${s.n}) in Exam mode to automatically mark this topic <b>completed</b> and advance your readiness rating.</li>
        <li>Questions are drawn adaptively: problems you previously missed return more frequently until mastered.</li>
        <li>Your test performance and per-question error history are safely preserved across sessions.</li>
      </ul>
    </div>
    <div class="qz-foot">
      <button class="btn primary lg" data-action="qz-start">${icon('play', 16, 'ico-fill')} Begin Assessment <kbd>Enter</kbd></button>
    </div>
  </div>`;
}

/* ----- question screen ----- */
function qzProgress(s) {
  return `<div class="qz-prog" aria-hidden="true">${s.qs.map((q, k) => {
    let c = k === s.cur ? 'cur' : k < s.cur || (k === s.cur && s.phase === 'fb') ? 'done' : '';
    if (s.mode === 'practice' && s.ans[k] !== undefined) c += s.ans[k] === q.a ? ' ok' : ' bad';
    return `<i class="${c}"></i>`;
  }).join('')}</div>`;
}

function qzQuestion(s, t) {
  const q = s.qs[s.cur], m = catMeta(t.category), fb = s.phase === 'fb', ans = s.ans[s.cur], last = s.cur + 1 >= s.n;
  const rem = Quiz.remainingMs(), pct = q.secs ? Math.max(0, rem / (q.secs * 1000) * 100) : 0;
  
  const opts = q.opts.map((o, i) => {
    let c = 'qz-opt';
    if (fb) {
      if (i === q.a) c += ' correct';
      else if (i === ans) c += ' wrong';
      else c += ' dim';
    } else if (s.sel === i) {
      c += ' sel';
    }
    return `<button class="${c}" data-action="qz-pick" data-val="${i}" ${fb ? 'disabled' : ''} aria-pressed="${s.sel === i}">
      <span class="qz-letter">${fb && i === q.a ? icon('check', 15) : LETTERS[i]}</span>
      <span class="qz-otext">${esc(o)}</span>
    </button>`;
  }).join('');

  const verdict = ans === q.a ? ['ok', '✓ Correct!'] : s.timedOut ? ['bad', '⏰ Time Expired'] : ['bad', '✗ Incorrect'];
  const feedback = fb ? `<div class="qz-fb ${verdict[0]}" role="status"><b>${verdict[1]}</b><p>${esc(q.e)}</p></div>` : '';
  
  const footer = fb
    ? `<button class="btn primary lg" data-action="qz-next">${last ? 'See Exam Results' : 'Next Question'} ${icon('arrow', 16)} <kbd>Enter</kbd></button>`
    : s.mode === 'exam'
      ? `<button class="btn primary lg" data-action="qz-confirm" ${s.sel === null ? 'disabled' : ''}>${last ? 'Submit Test' : 'Lock in Answer'} ${icon('arrow', 16)} <kbd>Enter</kbd></button>`
      : `<span class="muted small">Select an answer to see instant explanation.</span>`;

  return `<div class="qz-wrap q${s.mode === 'exam' ? ' exam' : ''}" style="--cat:${m.color}" id="qzMain" tabindex="-1">
    <div class="qz-bar">
      <button class="icon-btn" data-action="qz-quit" aria-label="Quit test">${icon('x', 20)}</button>
      <div class="qz-title">
        <small>${s.mode === 'exam' ? 'Exam Mode' : 'Practice Mode'} · ${esc(t.category)}</small>
        <b>${esc(t.name)}</b>
      </div>
      <div class="qz-count"><b>${s.cur + 1}</b>/${s.n}</div>
      ${q.secs && !fb ? `<div class="qz-time${rem <= 5000 ? ' low' : ''}" id="qzTime">${Math.ceil(rem / 1000)}s</div>` : ''}
    </div>
    ${qzProgress(s)}
    ${q.secs && !fb ? `<div class="qz-timer${pct <= 25 ? ' low' : ''}" id="qzTimer"><i id="qzBar" style="width:${pct}%"></i></div>` : '<div class="qz-timer off"></div>'}
    <div class="qz-card">
      <div class="qz-qnum">Question ${s.cur + 1} of ${s.n}${q.k ? ' · <span class="pill acc sm">Code Output / Analysis</span>' : ''}</div>
      <h2 class="qz-text">${esc(q.q)}</h2>
      ${codeBlock(q.k)}
      <div class="qz-options" role="group" aria-label="Answer options">${opts}</div>
      ${feedback}
    </div>
    <div class="qz-foot">${footer}</div>
  </div>`;
}

/* ----- review & results ----- */
function qzReviewItem(s, q, k) {
  const ans = s.ans[k], ok = ans === q.a;
  return `<article class="qz-rev ${ok ? 'ok' : 'bad'}">
    <header>
      <span class="qz-rev-n">${k + 1}</span>
      <span class="qz-rev-ic">${ok ? icon('check', 15) : icon('x', 15)}</span>
      <h4>${esc(q.q)}</h4>
    </header>
    ${codeBlock(q.k)}
    <ul>
      ${q.opts.map((o, i) => `<li class="${i === q.a ? 'correct' : i === ans ? 'wrong' : ''}">
        <span class="qz-letter sm">${LETTERS[i]}</span>
        <span>${esc(o)}</span>
        ${i === q.a ? '<em>Correct Answer</em>' : i === ans ? '<em>Your Choice</em>' : ''}
      </li>`).join('')}
    </ul>
    ${ans === null || ans === undefined ? '<p class="qz-skip">No answer selected (timeout).</p>' : ''}
    <p class="qz-why"><b>Explanation:</b> ${esc(q.e)}</p>
  </article>`;
}

function qzResult(s, t) {
  const r = s.result, m = catMeta(t.category);
  const state = r.dq ? 'dq' : r.kind === 'retry' ? 'retry' : r.passed ? 'pass' : 'fail';
  const need = Math.ceil(r.n * PASS_MARK / 100), more = Math.max(0, need - r.correct);
  const color = state === 'pass' ? 'var(--success)' : state === 'retry' ? 'var(--primary)' : 'var(--danger)';
  
  const head = {
    pass: 'Passed! Topic Mastered 🎉',
    fail: 'Threshold Not Met',
    dq: 'Assessment Disqualified',
    retry: 'Targeted Review Completed'
  }[state];

  const sub = state === 'pass'
    ? (r.completedNow ? 'Congratulations! This topic has been marked Complete in your roadmap.' : 'Solid score! Your confidence rating has been updated.')
    : state === 'dq' ? 'Tab switches exceeded the proctor threshold. The test was terminated.'
    : state === 'retry' ? 'Great practice session! Retakes help cement memory before the official exam.'
    : `You need ${PASS_MARK}% to pass. You were only ${plural(more, 'correct answer')} away!`;

  const wrongN = s.qs.filter((q, k) => s.ans[k] !== q.a).length;
  const f = s.reviewFilter;
  const items = s.qs.map((q, k) => ({ q, k })).filter(({ q, k }) => f === 'all' || (f === 'wrong' ? s.ans[k] !== q.a : s.ans[k] === q.a));
  const confLine = state === 'pass' && r.confTo !== r.confFrom ? `<span>Readiness Confidence: ${r.confFrom} → ${r.confTo}</span>` : '';

  return `<div class="qz-wrap result ${state}" style="--cat:${m.color}">
    <div class="qz-top">
      <button class="icon-btn" data-action="qz-close" aria-label="Close results">${icon('x', 20)}</button>

      ${ring({ pct: r.pct, size: 150, stroke: 13, color, label: `<b>${r.pct}%</b>`, sub: `${r.correct} / ${r.n}` })}
      <div class="qz-score-text">
        <h1>${head}</h1>
        <p class="muted">${sub}</p>
        <div class="qz-chips">
          <span>⏱ ${fmtMin(Math.max(1, Math.round(r.secs / 60)))} total time</span>
          <span>~${Math.round(r.secs / r.n)}s / question</span>
          <span>${r.mode === 'exam' ? 'Exam Mode' : 'Practice Mode'}</span>
          ${r.strikes ? `<span class="bad">${plural(r.strikes, 'tab leave penalty')}</span>` : ''}
          ${confLine}
        </div>
      </div>
    </div>
    <div class="qz-actions">
      <button class="btn primary" data-action="qz-retake">${icon('refresh', 15)} Retake Full Test</button>
      ${wrongN ? `<button class="btn" data-action="qz-retry-missed">${icon('target', 15)} Retry ${wrongN} Missed Questions</button>` : ''}
      <button class="btn" data-action="qz-share-card">${icon('download', 15)} Download Certificate Badge</button>
      <button class="btn" data-action="qz-close">Return to Dashboard</button>
    </div>
    ${state !== 'pass' && resLinks(t) ? `<div class="card qz-study"><b>Recommended Prep Materials:</b><div class="row-actions">${resLinks(t)}</div></div>` : ''}
    <div class="section-head">
      <h2>Detailed Question Breakdown</h2>
      <div class="seg-group" role="group">
        ${[['all', 'All (' + r.n + ')'], ['wrong', 'Missed (' + wrongN + ')'], ['ok', 'Correct (' + (r.n - wrongN) + ')']].map(([v, l]) => `<button class="seg-btn${f === v ? ' on' : ''}" data-action="qz-filter" data-val="${v}">${l}</button>`).join('')}
      </div>

      ${items.length ? items.map(({ q, k }) => qzReviewItem(s, q, k)).join('') : '<div class="empty"><div class="empty-emoji">🙌</div><h3>No questions match this filter</h3></div>'}
    </div>
  </div>`;
}

/* ----- anti-cheat warnings ----- */
const qzWarn = () => `<div class="qz-dialog" role="alertdialog" aria-modal="true" aria-labelledby="qzWarnT"><div class="modal sm"><h2 id="qzWarnT">⚠️ Tab Switch Warning</h2><p class="muted">Exam Mode is proctored. Navigating away or leaving this tab again will immediately terminate the test without scoring. Your timer continued running.</p><div class="modal-actions"><button class="btn primary" data-action="qz-warn-ok" autofocus>Resume Assessment</button></div></div></div>`;
const qzQuitDlg = () => `<div class="qz-dialog" role="alertdialog" aria-modal="true" aria-labelledby="qzQuitT"><div class="modal sm"><h2 id="qzQuitT">Quit Test?</h2><p class="muted">Are you sure you want to exit? Your answers and current progress will not be saved.</p><div class="modal-actions"><button class="btn" data-action="qz-quit-yes">Quit</button><button class="btn primary" data-action="qz-quit-no" autofocus>Continue Test</button></div></div></div>`;

let qzLastKey = '';
function renderQuiz() {
  const el = qzEl(), s = Quiz.s;
  if (!s) {
    el.hidden = true;
    el.innerHTML = '';
    document.body.classList.remove('quiz-open');
    document.body.classList.remove('no-scroll');
    qzLastKey = '';
    return;
  }
  const t = store.byId.get(s.topicId) || {
    id: s.topicId,
    name: s.topicId === 'daily' ? 'Daily Cross-Domain Challenge' : 'Weak-Topic Targeted Practice',
    category: s.topicId === 'daily' ? 'Java' : 'Spring Boot',
    num: s.topicId === 'daily' ? 'DAILY' : 'DRILL'
  };
  const fk = el.contains(document.activeElement) ? focusKey(document.activeElement) : null;
  const key = `${s.phase === 'fb' ? 'q' : s.phase}:${s.cur}:${s.phase === 'result' ? 'r' : ''}`;
  const keep = el.scrollTop, newScreen = key !== qzLastKey;
  qzLastKey = key;

  el.hidden = false;
  document.body.classList.add('quiz-open');
  document.body.classList.add('no-scroll');

  const html = s.phase === 'setup' ? qzSetup(s, t) : s.phase === 'result' ? qzResult(s, t) : qzQuestion(s, t);
  el.innerHTML = html + (s.warn ? qzWarn() : '') + (s.confirmQuit ? qzQuitDlg() : '');
  el.scrollTop = newScreen ? 0 : keep;

  if (s.phase === 'result' && !s.celebrated) {
    s.celebrated = true;
    if (s.result.passed) confetti(innerWidth / 2, innerHeight / 3, 140);
  }

  const dlg = $('.qz-dialog [autofocus]', el);
  if (dlg) dlg.focus({ preventScroll: true });
  else if (newScreen) {
    const m = $('#qzMain', el) || $('.qz-wrap', el);
    m && m.setAttribute('tabindex', '-1');
    m && m.focus({ preventScroll: true });
  } else {
    refocus(fk, el);
  }
}

Quiz.onChange = renderQuiz;
Quiz.onTimer = () => {
  const s = Quiz.s; if (!s || s.phase !== 'q') return;
  const q = s.qs[s.cur], rem = Quiz.remainingMs(), pct = Math.max(0, rem / (q.secs * 1000) * 100);
  const bar = document.getElementById('qzBar'), time = document.getElementById('qzTime'), wrap = document.getElementById('qzTimer');
  if (bar) bar.style.width = pct + '%';
  if (time) {
    time.textContent = Math.ceil(rem / 1000) + 's';
    time.classList.toggle('low', rem <= 5000);
  }
  if (wrap) wrap.classList.toggle('low', pct <= 25);
};

/* ----- action handlers ----- */
const QuizActions = {
  'quiz-open': (t, n) => {
    closePanel();
    if (!Quiz.openSetup(n.dataset.id)) {
      return toast('Question bank for this topic is currently being generated.', { title: 'Test Coming Soon', icon: '🧪' });
    }
    renderQuiz();
  },
  'qz-set': (t, n) => { Quiz.setOpt(n.dataset.key, n.dataset.val); renderQuiz(); },
  'qz-start': () => { Quiz.start(); renderQuiz(); },
  'qz-pick': (t, n) => { Quiz.pick(+n.dataset.val); renderQuiz(); },
  'qz-confirm': () => { Quiz.confirm(); renderQuiz(); },
  'qz-next': () => { Quiz.advance(); renderQuiz(); },
  'qz-quit': () => {
    const s = Quiz.s; if (!s) return;
    if (s.phase === 'setup' || s.phase === 'result') { Quiz.quit(); renderQuiz(); }
    else { s.confirmQuit = true; renderQuiz(); }
  },
  'qz-quit-no': () => { if (Quiz.s) { Quiz.s.confirmQuit = false; renderQuiz(); } },
  'qz-quit-yes': () => { Quiz.quit(); renderQuiz(); },
  'qz-close': () => { Quiz.quit(); renderQuiz(); },
  'qz-warn-ok': () => { if (Quiz.s) { Quiz.s.warn = false; renderQuiz(); } },
  'qz-retake': () => {
    const id = Quiz.s.topicId;
    Quiz.quit();
    if (Quiz.openSetup(id)) Quiz.start();
    renderQuiz();
  },
  'qz-retry-missed': () => { Quiz.retryMissed(); renderQuiz(); },
  'qz-filter': (t, n) => { Quiz.s.reviewFilter = n.dataset.val; renderQuiz(); },
  'qz-share-card': () => {
    if (!Quiz.s || !Quiz.s.result) return;
    const topic = store.byId.get(Quiz.s.topicId);
    if (typeof downloadShareCard === 'function') {
      downloadShareCard(Quiz.s.result, topic);
    }
  },
  'download-cert': (t, n) => {
    const idx = +n.dataset.idx;
    const att = store.tests.attempts[idx];
    if (!att) return;
    const topic = store.byId.get(att.topicId);
    if (typeof downloadShareCard === 'function') {
      downloadShareCard(att, topic);
    }
  }
};

/* Keyboard handling during active test */
function QuizKeys(e) {
  const s = Quiz.s; if (!s) return false;
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  const k = e.key, go = fn => { e.preventDefault(); fn(); return true; };
  if (s.warn) return (k === 'Enter' || k === 'Escape') ? go(QuizActions['qz-warn-ok']) : false;
  if (s.confirmQuit) return k === 'Escape' ? go(QuizActions['qz-quit-no']) : false;
  if (k === 'Escape') return go(QuizActions['qz-quit']);
  if (s.phase === 'setup') return k === 'Enter' && !e.target.closest('[data-action]') ? go(QuizActions['qz-start']) : false;
  if (s.phase === 'q') {
    const i = k.length === 1 ? ('1234'.indexOf(k) >= 0 ? +k - 1 : 'abcd'.indexOf(k.toLowerCase())) : -1;
    if (i >= 0 && i < 4) return go(() => QuizActions['qz-pick'](null, { dataset: { val: i } }));
    if (k === 'Enter') {
      const f = document.activeElement;
      if (s.sel === null && f && f.classList && f.classList.contains('qz-opt')) {
        return go(() => QuizActions['qz-pick'](null, { dataset: { val: f.dataset.val } }));
      }
      return go(QuizActions['qz-confirm']);
    }
  }
  if (s.phase === 'fb' && (k === 'Enter' || k === 'ArrowRight')) return go(QuizActions['qz-next']);
  return false;
}

document.addEventListener('visibilitychange', () => {
  const s = Quiz.s; if (!s) return;
  if (document.hidden) { Quiz.onHidden(); }
  else { if (s.phase === 'q') Quiz.onTick(); renderQuiz(); }
});

window.addEventListener('blur', () => {
  const s = Quiz.s; if (!s) return;
  if (s.mode === 'exam' && (s.phase === 'q' || s.phase === 'fb')) {
    Quiz.onHidden();
    renderQuiz();
  }
});

['contextmenu', 'copy', 'cut', 'selectstart', 'dragstart'].forEach(ev => {
  document.addEventListener(ev, e => {
    if (Quiz.s && Quiz.s.mode === 'exam' && Quiz.s.phase !== 'result' && Quiz.s.phase !== 'setup') {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      e.preventDefault();
    }
  });
});

</script>
  <!-- PeerJS WebRTC & Battle Engine -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
/* --- js/battle-engine.js --- */
'use strict';
/* =========================================================
   DevPath 1v1 Peer-to-Peer Battle Engine (WebRTC DataChannel)
   Enhanced with Multi-STUN, Auto-Retry, Heartbeat, and Synced Results
   ========================================================= */

const PEER_CONFIG = {
  debug: 0,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      { urls: 'stun:stun4.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' },
      { urls: 'stun:stun.cloudflare.com:3478' }
    ],
    iceCandidatePoolSize: 10
  }
};

const Battle = {
  peer: null,
  conn: null,
  isHost: false,
  isBot: false,
  room: null,
  tick: null,
  botTimer: null,
  heartbeatTimer: null,
  missedPings: 0,
  outbox: [],
  joinAttempts: 0,
  joinMaxAttempts: 3,

  s: {
    phase: 'idle', // 'idle' | 'lobby' | 'countdown' | 'battle' | 'waiting_opponent' | 'result' | 'forfeited'
    topicId: 'ja1',
    n: 10,
    secs: 20,
    qs: [],
    cur: 0,
    sel: null,
    deadline: 0,
    qStart: 0,
    winner: null,
    forfeitReason: '',
    local: {
      name: 'Player',
      avatar: '⚡',
      ready: false,
      score: 0,
      streak: 0,
      maxStreak: 0,
      answers: [],
      done: false
    },
    remote: {
      name: 'Waiting...',
      avatar: '👤',
      ready: false,
      score: 0,
      streak: 0,
      maxStreak: 0,
      answers: [],
      done: false
    }
  },

  active() {
    return this.s.phase === 'countdown' || this.s.phase === 'battle' || this.s.phase === 'waiting_opponent';
  },

  /* ----- Initialization & Networking ----- */
  init() {
    this.s.local.name = (store && store.settings && store.settings.name ? store.settings.name : 'Engineer_' + Math.floor(100 + Math.random() * 900)).trim();
    this.s.local.avatar = ['⚡', '🚀', '☕', '🍃', '🔥', '💎', '🎯', '🦁'][Math.floor(Math.random() * 8)];
    this.s.local.score = 0;
    this.s.local.streak = 0;
    this.s.local.maxStreak = 0;
    this.s.local.answers = [];
    this.s.local.done = false;
    this.s.remote.score = 0;
    this.s.remote.streak = 0;
    this.s.remote.maxStreak = 0;
    this.s.remote.answers = [];
    this.s.remote.done = false;
    this.s.winner = null;
    this.s.forfeitReason = '';
    this.outbox = [];
    this.missedPings = 0;
  },

  createRoom(topicId = 'ja1') {
    this.init();
    this.isHost = true;
    this.isBot = false;
    this.s.topicId = topicId;
    this.s.phase = 'lobby';
    this.s.local.ready = false;
    this.s.remote = { name: 'Awaiting Challenger...', avatar: '⏳', ready: false, score: 0, streak: 0, maxStreak: 0, answers: [], done: false };
    
    // Generate clean 6-character room code with high entropy
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    const roomId = 'devpath-' + code.toLowerCase();
    this.room = roomId;
    this.setupPeer(roomId);
    return roomId;
  },

  parseCode(raw) {
    if (!raw) return '';
    let str = String(raw).trim();
    const urlMatch = /[?&]room=([a-zA-Z0-9_-]+)/.exec(str);
    if (urlMatch && urlMatch[1]) str = urlMatch[1];
    str = str.replace(/^https?:\/\/[^\/]+/i, '').replace(/^[#/]+/, '');
    if (!str.toLowerCase().startsWith('devpath-') && /^[a-zA-Z0-9]{4,12}$/.test(str)) {
      str = 'devpath-' + str;
    }
    return str.toLowerCase();
  },

  shortCode() {
    return (this.room || '').replace(/^devpath-/, '').toUpperCase();
  },

  joinRoom(roomId) {
    const cleanId = this.parseCode(roomId);
    this.init();
    this.isHost = false;
    this.isBot = false;
    this.room = cleanId;
    this.s.phase = 'lobby';
    this.s.local.ready = false;
    this.s.remote = { name: 'Connecting to Host...', avatar: '⏳', ready: false, score: 0, streak: 0, maxStreak: 0, answers: [], done: false };
    this.joinAttempts = 1;
    this.setupPeer(null, cleanId);
  },

  startVsBot(topicId = 'ja1') {
    this.init();
    this.isHost = true;
    this.isBot = true;
    this.room = 'SOLO_VS_BOT';
    this.s.topicId = topicId;
    this.s.phase = 'lobby';
    this.s.local.ready = false;
    this.s.remote = { name: 'DevBot (AI)', avatar: '🤖', ready: true, score: 0, streak: 0, maxStreak: 0, answers: [], done: false };
    this.onChange && this.onChange();
  },

  setupPeer(customId, connectToId = null) {
    if (typeof Peer === 'undefined') {
      if (typeof console !== 'undefined' && console.warn) {
        console.warn('PeerJS library not detected.');
      }
      return;
    }

    try {
      this.cleanup();

      // Instantiate Peer with multi-STUN server configuration
      this.peer = customId ? new Peer(customId, PEER_CONFIG) : new Peer(PEER_CONFIG);

      this.peer.on('open', id => {
        if (this.isHost) {
          this.room = id;
        } else if (connectToId) {
          this.room = connectToId;
          this.connectToPeer(connectToId);
        }
        this.onChange && this.onChange();
      });

      this.peer.on('connection', c => {
        this.setupConn(c);
      });

      this.peer.on('error', err => {
        if (typeof console !== 'undefined' && console.error) console.error('PeerJS error:', err);
        
        // Handle peer-unavailable with retry for challenger
        if (err.type === 'peer-unavailable' && !this.isHost && connectToId && this.joinAttempts < this.joinMaxAttempts) {
          this.joinAttempts++;
          toast(`Host room waking up, reconnecting (${this.joinAttempts}/${this.joinMaxAttempts})…`, { title: 'Connecting…', icon: '⏳', ms: 2000 });
          setTimeout(() => {
            if (this.peer && !this.peer.destroyed) {
              this.connectToPeer(connectToId);
            }
          }, 1400);
          return;
        }

        let msg = 'P2P network notice: ' + err.type;
        if (err.type === 'peer-unavailable') {
          msg = 'Room not found. Please double-check the code or verify host has the room open.';
        } else if (err.type === 'unavailable-id') {
          msg = 'Room code was recently used. Generating fresh code…';
          if (this.isHost) setTimeout(() => this.createRoom(this.s.topicId), 400);
          return;
        }
        toast(msg, { title: '1v1 Arena Network', icon: '⚠️', kind: 'bad', ms: 4000 });
        this.onChange && this.onChange();
      });
    } catch (e) {
      if (typeof console !== 'undefined' && console.error) console.error('WebRTC initialization failed:', e);
    }
  },

  connectToPeer(targetId) {
    if (!this.peer || this.peer.destroyed) return;
    try {
      const c = this.peer.connect(targetId, {
        reliable: true,
        serialization: 'json'
      });
      this.setupConn(c);
    } catch (e) {
      console.warn('Peer connect attempt:', e);
    }
  },

  setupConn(c) {
    if (!c) return;
    this.conn = c;

    this.conn.on('open', () => {
      this.missedPings = 0;
      this.startHeartbeat();

      // Flush queued messages
      while (this.outbox.length) {
        const item = this.outbox.shift();
        try { this.conn.send(item); } catch(e){}
      }

      // Initiate handshake
      this.send({
        type: 'HELLO',
        name: this.s.local.name,
        avatar: this.s.local.avatar
      });

      this.onChange && this.onChange();
    });

    this.conn.on('data', data => {
      this.onMessage(data);
    });

    this.conn.on('close', () => {
      this.stopHeartbeat();
      if (this.active()) {
        this.forfeit('remote_disconnected');
      } else {
        toast('Challenger disconnected from room.', { title: 'Peer Left', icon: '🚪' });
        this.s.remote.ready = false;
        this.s.remote.name = 'Challenger disconnected';
        this.onChange && this.onChange();
      }
    });

    this.conn.on('error', err => {
      console.warn('DataChannel error:', err);
    });
  },

  send(msg) {
    if (this.conn && this.conn.open) {
      try {
        this.conn.send(msg);
      } catch (e) {
        this.outbox.push(msg);
      }
    } else {
      this.outbox.push(msg);
    }
  },

  /* ----- Heartbeat & Channel Keepalive ----- */
  startHeartbeat() {
    this.stopHeartbeat();
    this.heartbeatTimer = setInterval(() => {
      if (this.conn && this.conn.open) {
        this.send({ type: 'PING' });
        this.missedPings++;
        if (this.missedPings > 5 && this.active()) {
          this.forfeit('remote_disconnected');
        }
      }
    }, 3500);
  },

  stopHeartbeat() {
    if (this.heartbeatTimer) {
      clearInterval(this.heartbeatTimer);
      this.heartbeatTimer = null;
    }
  },

  /* ----- Message Protocol Dispatcher ----- */
  onMessage(msg) {
    if (!msg || !msg.type) return;

    switch (msg.type) {
      case 'PING':
        this.send({ type: 'PONG' });
        return;

      case 'PONG':
        this.missedPings = 0;
        return;

      case 'HELLO':
        this.s.remote.name = msg.name || 'Opponent';
        this.s.remote.avatar = msg.avatar || '👤';
        this.missedPings = 0;
        if (this.isHost) {
          this.send({
            type: 'HELLO_ACK',
            name: this.s.local.name,
            avatar: this.s.local.avatar,
            topicId: this.s.topicId,
            n: this.s.n,
            secs: this.s.secs
          });
          toast(`${this.s.remote.name} connected to your room!`, { title: 'Challenger Joined ⚡', icon: '🤝' });
        }
        break;

      case 'HELLO_ACK':
        this.s.remote.name = msg.name || 'Opponent';
        this.s.remote.avatar = msg.avatar || '👤';
        this.s.topicId = msg.topicId || this.s.topicId;
        this.s.n = msg.n || this.s.n;
        this.s.secs = msg.secs || this.s.secs;
        this.missedPings = 0;
        this.send({
          type: 'HELLO_CONFIRM',
          name: this.s.local.name,
          avatar: this.s.local.avatar
        });
        toast(`Connected to Host: ${this.s.remote.name}!`, { title: 'Room Synced ⚡', icon: '🤝' });
        break;

      case 'HELLO_CONFIRM':
        this.s.remote.name = msg.name || this.s.remote.name;
        this.s.remote.avatar = msg.avatar || this.s.remote.avatar;
        this.missedPings = 0;
        break;

      case 'CONFIG':
        this.s.topicId = msg.topicId;
        this.s.n = msg.n;
        this.s.secs = msg.secs;
        break;

      case 'READY':
        this.s.remote.ready = !!msg.ready;
        if (this.isHost && this.s.local.ready && this.s.remote.ready) {
          this.launchCountdown();
        }
        break;

      case 'START_COUNTDOWN':
        this.s.qs = msg.qs;
        this.s.n = msg.qs.length;
        this.s.secs = msg.secs;
        this.beginCountdown();
        break;

      case 'PROGRESS':
        this.s.remote.score = msg.score;
        this.s.remote.answers[msg.qIndex] = { isCorrect: !!msg.correct, pts: msg.pts || 0, timeUsed: msg.timeUsed || 0 };
        this.s.remote.done = !!msg.done;
        if (this.s.remote.done) {
          this.checkMatchCompletion();
        } else if (this.s.phase === 'battle') {
          this.onRemoteProgress && this.onRemoteProgress();
          return;
        }
        break;

      case 'FINISH':
        this.s.remote.score = msg.score;
        this.s.remote.done = true;
        this.s.remote.maxStreak = msg.maxStreak || 0;
        if (Array.isArray(msg.answers) && msg.answers.length) {
          this.s.remote.answers = msg.answers;
        }
        this.checkMatchCompletion();
        break;

      case 'FORFEIT':
        this.s.forfeitReason = msg.reason === 'tab_hidden' ? 'Opponent left the browser tab!' : 'Opponent disconnected.';
        this.s.winner = 'local';
        this.s.phase = 'forfeited';
        this.stopTicker();
        toast('Opponent disqualified for tab switching. Victory awarded!', { title: 'Match Forfeited 🏆', icon: '🏆' });
        break;

      case 'REMATCH_REQ':
        toast(this.s.remote.name + ' requested a rematch!', { title: 'Rematch Request ⚡', icon: '⚔️' });
        this.s.remote.ready = true;
        break;
    }
    this.onChange && this.onChange();
  },

  /* ----- Match Flow & Countdown ----- */
  toggleReady() {
    this.s.local.ready = !this.s.local.ready;
    if (this.isBot) {
      if (this.s.local.ready) this.launchCountdown();
    } else {
      this.send({ type: 'READY', ready: this.s.local.ready });
      if (this.isHost && this.s.local.ready && this.s.remote.ready) {
        this.launchCountdown();
      }
    }
    this.onChange && this.onChange();
  },

  launchCountdown() {
    // Host generates the exact identical question set
    const bank = QB.get(this.s.topicId);
    const n = Math.min(this.s.n, bank.length);
    const qs = drawQuestions(this.s.topicId, n).map((qIdx, idx) => {
      const src = bank[qIdx];
      const order = shuffle([0, 1, 2, 3]);
      return {
        idx,
        q: src.q,
        k: src.k,
        opts: order.map(o => (src.o || src.opts)[o]),
        a: order.indexOf(src.a),
        exp: src.e || src.exp || ''
      };
    });

    this.s.qs = qs;
    if (!this.isBot) {
      this.send({
        type: 'START_COUNTDOWN',
        qs,
        secs: this.s.secs
      });
    }
    this.beginCountdown();
  },

  beginCountdown() {
    this.s.phase = 'countdown';
    this.s.countdown = 3;

    const iv = setInterval(() => {
      this.s.countdown--;
      if (this.s.countdown <= 0) {
        clearInterval(iv);
        this.startBattle();
        return;
      }
      this.onChange && this.onChange();
    }, 1000);
    this.onChange && this.onChange();
  },

  startBattle() {
    this.s.phase = 'battle';
    this.s.cur = 0;
    this.s.local.score = 0;
    this.s.local.streak = 0;
    this.s.local.maxStreak = 0;
    this.s.local.answers = [];
    this.s.local.done = false;
    this.s.remote.score = 0;
    this.s.remote.streak = 0;
    this.s.remote.maxStreak = 0;
    this.s.remote.answers = [];
    this.s.remote.done = false;
    this.beginQ();
    if (this.isBot) this.scheduleBotAnswers();
  },

  beginQ() {
    this.stopTicker();
    const q = this.s.qs[this.s.cur];
    this.s.sel = null;
    this.s.qStart = Date.now();
    const qDuration = (this.s.secs * (q && q.k ? 1.5 : 1)) * 1000;
    this.s.deadline = Date.now() + qDuration;
    
    this.tick = setInterval(() => {
      const rem = Math.max(0, this.s.deadline - Date.now());
      if (rem <= 0) {
        this.submitAnswer(null); // Timeout -> 0 points
      }
      this.onTimer && this.onTimer();
    }, 100);
    this.onChange && this.onChange();
  },

  stopTicker() {
    if (this.tick) {
      clearInterval(this.tick);
      this.tick = null;
    }
  },

  submitAnswer(sel) {
    if (this.s.phase !== 'battle') return;
    this.stopTicker();
    
    const q = this.s.qs[this.s.cur];
    const isCorrect = sel !== null && sel === q.a;
    const timeUsed = Date.now() - this.s.qStart;
    const totalTime = (this.s.deadline - this.s.qStart);
    const timeRemaining = Math.max(0, this.s.deadline - Date.now());

    let pts = 0;
    if (isCorrect) {
      // Points = 1000 Base + Speed Bonus up to 1000 * streak multiplier
      const speedBonus = Math.round(1000 * (timeRemaining / Math.max(1000, totalTime)));
      this.s.local.streak++;
      if (this.s.local.streak > this.s.local.maxStreak) {
        this.s.local.maxStreak = this.s.local.streak;
      }
      const multiplier = Math.min(1.5, 1.0 + (this.s.local.streak - 1) * 0.1);
      pts = Math.round((1000 + speedBonus) * multiplier);
    } else {
      this.s.local.streak = 0;
    }

    this.s.local.score += pts;
    this.s.local.answers[this.s.cur] = { sel, isCorrect, pts, timeUsed };

    const isLast = (this.s.cur + 1 >= this.s.qs.length);

    // Broadcast live progress
    this.send({
      type: 'PROGRESS',
      qIndex: this.s.cur,
      score: this.s.local.score,
      correct: isCorrect,
      pts,
      timeUsed,
      done: isLast
    });

    if (!isLast) {
      this.s.cur++;
      this.beginQ();
    } else {
      this.s.local.done = true;
      // Send final full answers payload
      this.send({
        type: 'FINISH',
        score: this.s.local.score,
        maxStreak: this.s.local.maxStreak,
        answers: this.s.local.answers
      });

      if (this.s.remote.done) {
        this.finishMatch();
      } else {
        // Player enters waiting room with live opponent tracker
        this.s.phase = 'waiting_opponent';
        this.onChange && this.onChange();
      }
    }
  },

  /* ----- AI Bot Simulation ----- */
  scheduleBotAnswers() {
    clearTimeout(this.botTimer);
    let botQ = 0;
    const runNextBotAnswer = () => {
      if (botQ >= this.s.qs.length || !this.active()) return;
      const delay = 3500 + Math.random() * 6000;
      this.botTimer = setTimeout(() => {
        const isCorrect = Math.random() < 0.80; // 80% accuracy
        const speedBonus = Math.round(900 * Math.random());
        const pts = isCorrect ? (1000 + speedBonus) : 0;
        this.s.remote.score += pts;
        this.s.remote.answers[botQ] = { isCorrect, pts, timeUsed: Math.round(delay) };
        botQ++;
        if (botQ >= this.s.qs.length) {
          this.s.remote.done = true;
          this.checkMatchCompletion();
        } else {
          if (this.s.phase === 'battle') {
            this.onRemoteProgress && this.onRemoteProgress();
          } else {
            this.onChange && this.onChange();
          }
          runNextBotAnswer();
        }
      }, delay);
    };
    runNextBotAnswer();
  },

  /* ----- Anti-Cheat Tab Monitor ----- */
  onTabHidden() {
    if (this.active()) {
      this.send({ type: 'FORFEIT', reason: 'tab_hidden' });
      this.s.forfeitReason = 'You switched tabs! The duel was forfeited.';
      this.s.winner = 'remote';
      this.s.phase = 'forfeited';
      this.stopTicker();
      clearTimeout(this.botTimer);
      this.onChange && this.onChange();
    }
  },

  forfeit(reason = '') {
    this.stopTicker();
    clearTimeout(this.botTimer);
    this.s.phase = 'forfeited';
    this.s.winner = 'remote';
    this.s.forfeitReason = reason === 'tab_hidden' ? 'Match forfeited due to tab switch.' : 'Match disconnected.';
    this.onChange && this.onChange();
  },

  checkMatchCompletion() {
    if (this.s.local.done && this.s.remote.done) {
      this.finishMatch();
    }
  },

  finishMatch() {
    this.s.phase = 'result';
    this.stopTicker();
    clearTimeout(this.botTimer);

    if (this.s.local.score > this.s.remote.score) this.s.winner = 'local';
    else if (this.s.local.score < this.s.remote.score) this.s.winner = 'remote';
    else this.s.winner = 'tie';

    if (this.s.winner === 'local') {
      if (typeof confetti === 'function') confetti(innerWidth / 2, innerHeight / 3, 160);
      if (typeof beep === 'function') beep();
    }
    this.onChange && this.onChange();
  },

  cleanup() {
    this.stopTicker();
    this.stopHeartbeat();
    clearTimeout(this.botTimer);
    if (this.conn) {
      try { this.conn.close(); } catch(e){}
      this.conn = null;
    }
    if (this.peer) {
      try { this.peer.destroy(); } catch(e){}
      this.peer = null;
    }
  },

  exit() {
    this.cleanup();
    this.s.phase = 'idle';
  }
};

              const remPts = remAns && typeof remAns === 'object' ? remAns.pts : (remOk ? '✓' : 0);
              const locTime = locAns && locAns.timeUsed ? (locAns.timeUsed / 1000).toFixed(1) + 's' : '';
              const remTime = remAns && remAns.timeUsed ? (remAns.timeUsed / 1000).toFixed(1) + 's' : '';

              return `<tr>
                <td><b>${idx + 1}</b></td>
                <td>
                  <div style="font-weight:600;color:var(--text);line-height:1.35;margin-bottom:3px;">${esc(q.q)}</div>
                  <small class="muted">Correct Answer: <b>${esc(q.opts[q.a])}</b></small>
                </td>
                <td>
                  <span class="pill ${locOk ? 'ok' : 'warn'} sm">
                    ${locOk ? `✓ +${locPts} (${locTime})` : '✗ Missed'}
                  </span>
                </td>
                <td>
                  <span class="pill ${remOk ? 'ok' : 'warn'} sm">
                    ${remOk ? `✓ +${remPts} (${remTime})` : '✗ Missed'}
                  </span>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function renderBattle() {
  const el = btlEl(), s = Battle.s;
  if (s.phase === 'idle') {
    el.hidden = true;
    el.innerHTML = '';
    document.body.classList.remove('quiz-open');
    document.body.classList.remove('no-scroll');
    return;
  }

  el.hidden = false;
  document.body.classList.add('quiz-open');
  document.body.classList.add('no-scroll');

  // Smooth in-place update for countdown to avoid flicker
  if (s.phase === 'countdown') {
    const numEl = el.querySelector('.countdown-number');
    if (numEl) {
      numEl.textContent = s.countdown || 3;
      return;
    }
  }

  let html = '';
  if (s.phase === 'lobby') html = btlLobby(s);
  else if (s.phase === 'countdown') html = btlCountdown(s);
  else if (s.phase === 'battle') html = btlArena(s);
  else if (s.phase === 'waiting_opponent') html = btlWaitingOpponent(s);
  else if (s.phase === 'result' || s.phase === 'forfeited') html = btlPodium(s);

  el.innerHTML = html;
}

Battle.onChange = renderBattle;
Battle.onTimer = () => {

  if (t && Battle.s && Battle.s.phase === 'battle') {
    const rem = Math.max(0, Math.ceil((Battle.s.deadline - Date.now()) / 1000));
    t.textContent = rem + 's';
    t.classList.toggle('danger', rem <= 5);

};

Battle.onRemoteProgress = () => {
  const s = Battle.s;
  if (!s || s.phase !== 'battle') return;
  const remoteScoreEl = document.querySelector('.hud-player.right .hud-score');
  if (remoteScoreEl) {
    remoteScoreEl.innerHTML = `${s.remote.score.toLocaleString()} <small style="font-size:0.7rem;color:var(--muted)">pts</small>`;

  const remoteProgEl = document.querySelector('.hud-player.right .hud-prog-bar i');
  if (remoteProgEl) {
    const remoteAnswered = s.remote.answers.filter(x => x !== undefined).length;
    const remoteProg = Math.round((remoteAnswered / Math.max(1, s.qs.length)) * 100);
    remoteProgEl.style.width = `${remoteProg}%`;
  }
};

/* ----- Action Handlers for Battle ----- */
const BattleActions = {

'use strict';

const PWA = {

           window.navigator.standalone === true ||

      e.preventDefault();

    const card = document.createElement('div');

      <div class="pwa-card-ico">📲</div>
      <div class="pwa-card-body">
        <b>Install DevPath App</b>
        <p>${isIOS ? 'Add DevPath to your iPhone Home Screen for full-screen exams & offline practice.' : 'Install DevPath for instant desktop/phone access, offline practice & proctored 1v1 duels.'}</p>
        <div class="pwa-card-actions">

  /* ----- Service Worker & Live Update Card ----- */
  setupServiceWorker() {
    if (!('serviceWorker' in navigator)) return;

    // Reload when the waiting worker takes control
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();

        if (reg.waiting) {

        }

        // Detect newly installed worker
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              this.showUpdateNotification(newWorker);
            }
          });
        });

        // Check for updates when user returns to the tab
        window.addEventListener('focus', () => {
          reg.update().catch(() => {});
        });

        // Periodic update check every 15 minutes
        setInterval(() => {
          reg.update().catch(() => {});
        }, 900000);
      }).catch(err => {
        console.warn('DevPath SW registration:', err);
      });
    });
  },

  showUpdateNotification(worker = null) {

    const card = document.createElement('div');

    `;
    document.body.appendChild(card);

    document.getElementById('pwaUpdateNowBtn')?.addEventListener('click', () => {
      this.applyUpdate();
    });

    const dismiss = () => {
      card.remove();
    };

    document.getElementById('pwaDismissUpdateBtn')?.addEventListener('click', dismiss);
    document.getElementById('pwaCloseUpdateBtn')?.addEventListener('click', dismiss);
  },

  applyUpdate() {
    if (typeof toast === 'function') {
      toast('Updating DevPath to the latest version…', { title: 'Updating App ⚡', icon: '⚡' });
    }
    if (this.waitingWorker) {
      this.waitingWorker.postMessage({ type: 'SKIP_WAITING' });
    }
    // Flush caches and reload
    if (window.caches) {
      caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
        setTimeout(() => window.location.reload(true), 300);
      });
    } else {
      setTimeout(() => window.location.reload(true), 300);
    }
  },

  /* Check version.json periodically */
  pollVersion() {
    const check = () => {
      fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data && data.version && data.version !== this.currentVersion) {
            this.showUpdateNotification(this.waitingWorker);
          }
        })
        .catch(() => {});
    };

    setTimeout(check, 5000);
    window.addEventListener('focus', check);
  }
};

window.addEventListener('DOMContentLoaded', () => {
  PWA.init();
});

/* --- js/app.js --- */
'use strict';
/* =========================================================
   DevPath Application Controller & Event Orchestrator
   ========================================================= */

const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAGES = ['dashboard', 'tests', 'library', 'roadmap', 'interview', 'revision', 'insights'];
const PAGE_TITLES = {
  dashboard: 'Dashboard',
  tests: 'Tests & Assessments',
  library: 'Curriculum Library',
  roadmap: 'Roadmap',
  interview: 'Interview Mode',
  revision: 'Revision Queue',
  insights: 'Analytics & Insights'
};
const HUES = [[239, 'Indigo'], [262, 'Violet'], [200, 'Cyan'], [160, 'Emerald'], [25, 'Orange'], [340, 'Rose']];

/* Core Element References */
const el = {
  app: $('#app'),
  main: $('#main'),
  side: $('#sidebar'),
  top: $('#topStats'),
  panel: $('#panel'),
  overlay: $('#overlay'),
  modal: $('#modal'),
  palette: $('#palette'),
  toasts: $('#toasts'),
  dock: $('#dock'),
  tabbar: $('#tabbar'),
  search: $('#globalSearch'),
  canvas: $('#confetti')
};

/* ----- Theme Engine ----- */
function applyTheme() {
  const t = store.settings.theme;
  const eff = t === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
  document.documentElement.dataset.theme = eff;
  document.documentElement.style.setProperty('--hue', store.settings.hue);

  const h = +store.settings.hue;
  document.documentElement.style.setProperty('--on-primary', (h >= 220 || h < 10) ? '#ffffff' : '#07130f');
  
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.content = eff === 'light' ? '#f4f6fb' : '#0b0d17';
  
  const b = $('#themeBtn');
  if (b) {
    b.innerHTML = icon(eff === 'light' ? 'moon' : 'sun', 18);
    b.title = eff === 'light' ? 'Switch to Dark Theme (T)' : 'Switch to Light Theme (T)';
  }
}

function setTheme(t) {
  store.settings.theme = t;
  store.saveSettings();
  applyTheme();
}

function toggleTheme() {
  setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
}

matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => {
  if (store.settings.theme === 'auto') applyTheme();
});

/* ----- Focus Retention Across Re-Renders ----- */
function focusKey(node) {
  if (!node || !node.dataset || !(node.dataset.action || node.dataset.change)) return null;
  const d = node.dataset;
  return { action: d.action, change: d.change, id: d.id, val: d.val, key: d.key, cat: d.cat };
}

function refocus(k, root = document) {
  if (!k) return;
  const sel = `[data-${k.action ? 'action' : 'change'}="${k.action || k.change}"]`;
  const hit = $$(sel, root).find(e =>
    (k.id === undefined || e.dataset.id === k.id) &&
    (k.val === undefined || e.dataset.val === k.val) &&
    (k.key === undefined || e.dataset.key === k.key) &&
    (k.cat === undefined || e.dataset.cat === k.cat)
  );
  if (hit) hit.focus({ preventScroll: true });
}

/* ----- Toast Notification Stack ----- */
function toast(msg, o = {}) {
  const t = document.createElement('div');
  t.className = 'toast' + (o.kind ? ' ' + o.kind : '');
  t.innerHTML = `<span class="toast-ico">${o.icon || '✓'}</span><div class="toast-msg"><b>${esc(o.title || msg)}</b>${o.title && msg ? `<small>${esc(msg)}</small>` : ''}</div>`;
  if (o.action) {
    const b = document.createElement('button');
    b.className = 'toast-act';
    b.textContent = o.action.label;
    b.addEventListener('click', () => { o.action.fn(); dismiss(); });
    t.appendChild(b);
  }
  const dismiss = () => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 250);
  };
  el.toasts.appendChild(t);
  while (el.toasts.children.length > 4) el.toasts.firstChild.remove();
  setTimeout(dismiss, o.ms || 4200);
}

/* ----- Confetti Particle Physics ----- */
const confettiState = { parts: [], raf: 0 };
function confetti(x, y, n = 70) {
  if (reduceMotion() || !el.canvas) return;
  const c = el.canvas, dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr;
  c.height = innerHeight * dpr;
  c.style.width = innerWidth + 'px';
  c.style.height = innerHeight + 'px';
  const ctx = c.getContext('2d');
  if (!ctx) return;

  const colors = ['#6366f1', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4', '#ef4444', '#a855f7'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
    confettiState.parts.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 5,
      g: 0.22 + Math.random() * 0.1,
      r: Math.random() * 6,
      vr: (Math.random() - 0.5) * 0.4,
      w: 5 + Math.random() * 6,
      h: 3 + Math.random() * 5,
      col: colors[i % colors.length],
      life: 1
    });
  }

  if (confettiState.raf) return;
  const step = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    confettiState.parts = confettiState.parts.filter(p => p.life > 0 && p.y < innerHeight + 30);
    for (const p of confettiState.parts) {
      p.vy += p.g;
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.r += p.vr;
      p.life -= 0.006;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (confettiState.parts.length) confettiState.raf = requestAnimationFrame(step);
    else { confettiState.raf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  };
  confettiState.raf = requestAnimationFrame(step);
}
const burstFrom = (rect, n) => rect ? confetti(rect.left + rect.width / 2, rect.top + rect.height / 2, n) : confetti(innerWidth / 2, innerHeight / 3, n);

/* ----- Audio Cues (Native Web Audio API) ----- */
function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    const ctx = new A();
    [[660, 0], [880, 0.18], [1100, 0.36]].forEach(([f, t]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f;
      o.type = 'sine';
      o.connect(g);
      g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.3);
      o.start(ctx.currentTime + t);
      o.stop(ctx.currentTime + t + 0.32);
    });
    setTimeout(() => ctx.close && ctx.close(), 1200);
  } catch { /* audio muted/blocked */ }
}

/* ----- Router & Rendering ----- */
let lastRouteKey = '';
function parseHash() {
  let h = '';
  try { h = decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch { h = ''; }
  const [p, ...rest] = h.split('/'), arg = rest.join('/');
  if (p === 'category' && CATEGORIES.includes(arg)) return { page: 'category', cat: arg };
  return { page: PAGES.includes(p) ? p : 'dashboard', cat: null };
}

function animateCounts() {
  if (reduceMotion()) return;
  $$('[data-count]').forEach(n => {
    const end = +n.dataset.count, suf = n.dataset.suffix || '';
    if (!end) return;
    const t0 = performance.now();
    const step = t => {
      const p = Math.min(1, (t - t0) / 700);
      n.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))) + suf;
      if (p < 1) requestAnimationFrame(step);
    };
    n.textContent = '0' + suf;
    requestAnimationFrame(step);
  });
}

function syncRoute() {
  const prev = ui.route, next = parseHash(), f = ui.filters;
  if (next.page === 'category') {
    if (prev.page !== 'category' || prev.cat !== next.cat) {
      f.q = ''; f.status = 'all'; f.diff = 'all';
      if (el.search) el.search.value = '';
    }
    f.cat = next.cat;
  } else if (prev.page === 'category') {
    f.cat = 'all';
  }
  if (prev.page === 'interview' && next.page !== 'interview') stopDrillTimer();
  ui.route = next;
  return `${next.page}:${next.cat || ''}`;
}

function render(opts = {}) {
  const routeKey = opts.route ? syncRoute() : `${ui.route.page}:${ui.route.cat || ''}`;
  const newRoute = opts.route && routeKey !== lastRouteKey;
  lastRouteKey = routeKey;

  const active = document.activeElement;
  const fk = (active && (el.main.contains(active) || el.side.contains(active))) ? focusKey(active) : null;
  const y = window.scrollY;
  const view = ui.route.page === 'category' ? 'library' : ui.route.page;

  try {
    el.main.innerHTML = Views[view](ui.route);
  } catch (err) {
    console.error(err);
    el.main.innerHTML = `<div class="card"><h2>Error rendering view</h2><p class="muted">${esc(err.message)}</p><button class="btn primary" data-action="nav" data-href="#/dashboard">Return to Dashboard</button></div>`;
  }

  el.side.innerHTML = Views.sidebar();
  renderTop();
  renderTabbar();
  document.title = `${ui.route.page === 'category' ? ui.route.cat : PAGE_TITLES[ui.route.page]} · DevPath`;

  if (newRoute) {
    el.main.classList.remove('enter');
    void el.main.offsetWidth;
    el.main.classList.add('enter');
    window.scrollTo(0, 0);
    animateCounts();
    closeSidebar();
    if (ui.route.page === 'category' || ui.route.page === 'library') {
      if (el.search) el.search.value = ui.filters.q;
    }
  } else {
    window.scrollTo(0, y);
  }

  refocus(fk, el.app);
  if (timer.s) updateDockTitle();
}

/* ----- Layer Management: Overlays, Panels, Modals ----- */
const layerState = { panelOpener: null, modalOpener: null, paletteOpener: null };

function setOverlay() {
  const on = !!(ui.panelId || document.body.classList.contains('side-open') || !el.modal.hidden || !el.palette.hidden);
  el.overlay.classList.toggle('show', on);
  document.body.classList.toggle('no-scroll', on);
}

function openSidebar() { document.body.classList.add('side-open'); setOverlay(); }
function closeSidebar() { document.body.classList.remove('side-open'); setOverlay(); }

function openPanel(id) {
  const t = store.byId.get(id); if (!t) return;
  if (!ui.panelId) layerState.panelOpener = document.activeElement;
  ui.panelId = id;
  refreshPanel();
  document.body.classList.add('panel-open');
  el.panel.classList.add('open');
  el.panel.setAttribute('aria-hidden', 'false');
  el.panel.removeAttribute('inert');
  setOverlay();
  const body = $('.panel-body', el.panel);

  setTimeout(() => {

function refreshPanel() {
  const t = store.byId.get(ui.panelId); if (!t) return;
  const active = document.activeElement, fk = el.panel.contains(active) ? focusKey(active) : null;
  const scroll = $('.panel-body', el.panel)?.scrollTop || 0;

}

function closePanel() {
  if (!ui.panelId) return;
  ui.panelId = null;
  document.body.classList.remove('panel-open');
  el.panel.classList.remove('open');
  el.panel.setAttribute('aria-hidden', 'true');
  el.panel.setAttribute('inert', '');
  setOverlay();
  const o = layerState.panelOpener;
  layerState.panelOpener = null;
  if (o && document.contains(o)) o.focus({ preventScroll: true });
}

function openModal(html, cls = '') {
  if (el.modal.hidden) layerState.modalOpener = document.activeElement;
  el.modal.hidden = false;
  el.modal.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  setOverlay();

  setTimeout(() => first && first.focus({ preventScroll: true }), 20);
}

function closeModal() {
  if (el.modal.hidden) return;
  el.modal.hidden = true;
  el.modal.innerHTML = '';
  setOverlay();
  const o = layerState.modalOpener;
  layerState.modalOpener = null;
  if (o && document.contains(o)) o.focus({ preventScroll: true });
}

function confirmDialog({ title, text, confirm = 'Confirm', danger = false }, onYes) {
  openModal(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-action="confirm-yes">${esc(confirm)}</button></div>`, 'sm');

}

function closeTopLayer() {
  if (!el.palette.hidden) return closePalette(), true;
